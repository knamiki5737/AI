<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>乃木坂グルメ人生ゲーム</title>
<style>
/* =========================================================
   乃木坂グルメ人生ゲーム  -  ファミコン風 単一HTMLゲーム
   さくらインターネット ドキュメントルートに置くだけで動作
   外部依存なし（フォント・画像・通信なし）
   ========================================================= */

:root{
  --nes-black:#0b0b14;
  --nes-dark:#1a1a2e;
  --nes-blue:#2c5fd1;
  --nes-lightblue:#7ec0ff;
  --nes-red:#e23636;
  --nes-yellow:#fbd000;
  --nes-green:#3ec73e;
  --nes-pink:#ff77b7;
  --nes-white:#f8f8f8;
  --nes-gray:#7d7d8e;
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{
  height:100%;
  background:#000;
  color:var(--nes-white);
  font-family:"MS Gothic","Hiragino Kaku Gothic Pro",monospace;
  -webkit-font-smoothing:none;
  font-smooth:never;
  image-rendering:pixelated;
  overflow:hidden;
  touch-action:manipulation;
}

/* ピクセルっぽい縁取り文字 */
.pixtext{
  text-shadow:
    -2px 0 #000, 2px 0 #000, 0 -2px #000, 0 2px #000,
    -2px -2px #000, 2px -2px #000, -2px 2px #000, 2px 2px #000;
  letter-spacing:1px;
}

#screen{
  position:relative;
  width:100%;
  max-width:560px;
  margin:0 auto;
  height:100%;
  max-height:100vh;
  background:linear-gradient(180deg,#102a54 0%, #1a1a2e 60%, #0b0b14 100%);
  display:flex;
  flex-direction:column;
  border-left:4px solid #000;
  border-right:4px solid #000;
  overflow:hidden;
}

/* ===== 上部ステータスバー ===== */
#hud{
  flex:0 0 auto;
  background:#000;
  border-bottom:4px solid var(--nes-blue);
  padding:6px 8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
}
#hud .stat{ display:flex; flex-direction:column; gap:2px; }
#hud .label{ color:var(--nes-lightblue); font-size:9px; }
#hud .money{ color:var(--nes-yellow); font-size:14px; }
#hud .gourmet{ color:var(--nes-pink); font-size:14px; }
#hud .turn{ color:var(--nes-green); font-size:14px; text-align:right;}

/* ===== ボード表示エリア ===== */
#board-wrap{
  flex:1 1 auto;
  position:relative;
  overflow:hidden;
}
#board{
  position:absolute;
  top:0; left:0;
  transition:transform .35s ease-out;
}
.cell{
  position:absolute;
  width:64px; height:64px;
  border:3px solid #000;
  border-radius:6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:9px;
  text-align:center;
  color:#000;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35), 3px 3px 0 rgba(0,0,0,.5);
  overflow:hidden;
  padding:2px;
}
.cell .ico{ font-size:22px; line-height:1; }
.cell .nm{ font-size:8px; line-height:1.05; margin-top:1px; font-weight:bold;}
.cell.start{ background:var(--nes-green); }
.cell.goal{ background:var(--nes-yellow); }
.cell.food{ background:var(--nes-pink); }
.cell.event{ background:var(--nes-lightblue); }
.cell.land{ background:#caa86a; }

/* マスを繋ぐ道（点線） */
.path-dot{
  position:absolute;
  width:8px;height:8px;border-radius:50%;
  background:var(--nes-white);
  opacity:.55;
  box-shadow:0 0 0 2px #000;
}

/* プレイヤーの駒（車） */
#piece{
  position:absolute;
  width:34px;height:34px;
  z-index:30;
  transition:left .18s linear, top .18s linear;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
  filter:drop-shadow(2px 2px 0 #000);
  pointer-events:none;
}

/* ===== 下部コントロール ===== */
#controls{
  flex:0 0 auto;
  background:#000;
  border-top:4px solid var(--nes-blue);
  padding:8px;
  display:flex;
  align-items:center;
  gap:10px;
  min-height:96px;
}

/* ルーレット */
#roulette{
  flex:0 0 auto;
  width:78px;height:78px;
  position:relative;
}
#roulette .ring{
  width:78px;height:78px;border-radius:50%;
  border:4px solid #000;
  background:
    conic-gradient(
      var(--nes-red) 0deg 60deg,
      var(--nes-yellow) 60deg 120deg,
      var(--nes-green) 120deg 180deg,
      var(--nes-lightblue) 180deg 240deg,
      var(--nes-pink) 240deg 300deg,
      var(--nes-blue) 300deg 360deg);
  transition:transform 1.6s cubic-bezier(.17,.67,.3,1.0);
}
#roulette .hub{
  position:absolute; top:50%; left:50%;
  width:34px;height:34px;margin:-17px 0 0 -17px;
  background:#000;border:3px solid var(--nes-white);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--nes-yellow);font-size:18px;font-weight:bold;
}
#roulette .needle{
  position:absolute; top:-6px; left:50%; margin-left:-7px;
  width:0;height:0;
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-top:14px solid var(--nes-white);
  filter:drop-shadow(0 0 1px #000);
  z-index:5;
}

#btn-area{ flex:1 1 auto; display:flex; flex-direction:column; gap:6px; }
.btn{
  font-family:inherit;
  font-weight:bold;
  font-size:14px;
  color:#fff;
  background:var(--nes-red);
  border:3px solid #000;
  border-radius:6px;
  padding:10px 8px;
  cursor:pointer;
  box-shadow:0 4px 0 #7a1010, inset 0 0 0 2px rgba(255,255,255,.25);
  letter-spacing:1px;
}
.btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #7a1010, inset 0 0 0 2px rgba(255,255,255,.25); }
.btn.blue{ background:var(--nes-blue); box-shadow:0 4px 0 #143a8a, inset 0 0 0 2px rgba(255,255,255,.25);}
.btn:disabled{ background:var(--nes-gray); box-shadow:0 4px 0 #4a4a55; cursor:not-allowed; opacity:.7;}
#dice-msg{ font-size:11px; color:var(--nes-lightblue); text-align:center; min-height:14px;}

/* ===== ダイアログ（ファミコン風メッセージ窓） ===== */
.overlay{
  position:absolute; inset:0;
  background:rgba(0,0,10,.72);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:14px;
}
.overlay.show{ display:flex; }
.window{
  width:100%;
  max-width:440px;
  background:#000;
  border:4px solid var(--nes-white);
  border-radius:4px;
  box-shadow:0 0 0 4px #000, 6px 6px 0 rgba(0,0,0,.6);
  padding:14px;
}
.window h2{
  color:var(--nes-yellow);
  font-size:16px;
  margin-bottom:8px;
  text-align:center;
}
.window .ico-big{ font-size:48px; text-align:center; margin:4px 0;}
.window p{ font-size:12px; line-height:1.6; color:var(--nes-white); }
.window .note{ font-size:10px; color:var(--nes-gray); margin-top:8px; }
.window .delta{ font-size:15px; font-weight:bold; text-align:center; margin:8px 0;}
.delta.plus{ color:var(--nes-green); }
.delta.minus{ color:var(--nes-red); }
.window .btn{ width:100%; margin-top:10px; }

/* タイトル画面 */
#title{
  position:absolute; inset:0;
  z-index:200;
  background:linear-gradient(180deg,#06112e,#1a1a2e);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  text-align:center;
  padding:20px;
}
#title .logo{
  font-size:26px; line-height:1.4; color:var(--nes-yellow);
  margin-bottom:6px;
}
#title .logo .sub{ display:block; color:var(--nes-pink); font-size:18px; margin-top:6px;}
#title .blurb{ font-size:11px; color:var(--nes-lightblue); margin:14px 0 22px; line-height:1.7;}
#title .press{ font-size:13px; color:var(--nes-white); animation:blink 1s steps(2) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
#title .copyfoot{ position:absolute; bottom:10px; font-size:8px; color:var(--nes-gray); line-height:1.5; padding:0 8px;}

/* スキャンライン演出 */
#screen::after{
  content:"";
  position:absolute; inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(
    0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.10) 3px);
  z-index:150;
  mix-blend-mode:multiply;
}

/* ミニマップ凡例 */
#legend{
  position:absolute; top:8px; right:8px;
  background:rgba(0,0,0,.6);
  border:2px solid #000;
  border-radius:4px;
  padding:4px 6px;
  font-size:8px;
  z-index:40;
  line-height:1.6;
}
#legend span{ display:inline-block; width:8px;height:8px;border:1px solid #000;margin-right:3px;vertical-align:middle;}

#sound-toggle{
  position:absolute; top:8px; left:8px;
  z-index:40;
  background:rgba(0,0,0,.6);
  border:2px solid #000;border-radius:4px;
  color:var(--nes-yellow);font-size:10px;
  padding:4px 6px;cursor:pointer;font-family:inherit;
}

/* ===== サングラス・インベーダー ===== */
#invader-overlay{ z-index:120; }
#inv-hud{
  flex:0 0 auto; width:100%;
  display:flex; justify-content:space-between;
  padding:8px 12px; font-size:12px;
  color:var(--nes-green); background:#000;
  border-bottom:3px solid var(--nes-green);
}
#inv-hud #inv-life{ color:var(--nes-yellow); }
#inv-hud #inv-wave{ color:var(--nes-lightblue); }
#inv-canvas{
  flex:1 1 auto; width:100%; display:block;
  background:#000;
  image-rendering:pixelated;
  touch-action:none;
}
#inv-pad{
  flex:0 0 auto; width:100%;
  display:flex; gap:8px; padding:8px;
  background:#000; border-top:3px solid var(--nes-green);
}
.ipad{
  flex:1 1 0;
  font-family:inherit; font-weight:bold; font-size:20px;
  color:#fff; background:var(--nes-blue);
  border:3px solid #000; border-radius:8px;
  padding:14px 0; cursor:pointer; user-select:none;
  box-shadow:0 4px 0 #143a8a, inset 0 0 0 2px rgba(255,255,255,.25);
  -webkit-tap-highlight-color:transparent;
}
.ipad.fire{ flex:1.4 1 0; background:var(--nes-red); box-shadow:0 4px 0 #7a1010, inset 0 0 0 2px rgba(255,255,255,.25); font-size:16px;}
.ipad:active{ transform:translateY(3px); box-shadow:0 1px 0 #143a8a, inset 0 0 0 2px rgba(255,255,255,.25); }
.ipad.fire:active{ box-shadow:0 1px 0 #7a1010, inset 0 0 0 2px rgba(255,255,255,.25); }
#inv-msg{ position:absolute; }
</style>
</head>
<body>
<div id="screen">

  <!-- ===== タイトル画面 ===== -->
  <div id="title">
    <div class="logo pixtext">乃木坂グルメ<span class="sub">人生ゲーム</span></div>
    <div class="blurb pixtext">
      ルーレットを まわして<br>
      乃木坂駅しゅうへんを たびしよう！<br>
      グルメスポットで グルメ度を あげ<br>
      ゴールを めざせ！
    </div>
    <div class="press pixtext">▶ PUSH START ◀</div>
    <div class="copyfoot pixtext">
      ※マスのお店情報は「サンプル（要確認）」です。<br>
      実在店舗の正確な情報は各自でご確認ください。
    </div>
  </div>

  <!-- ===== HUD ===== -->
  <div id="hud" class="pixtext">
    <div class="stat">
      <span class="label">しょじきん</span>
      <span class="money" id="hud-money">¥3,000</span>
    </div>
    <div class="stat">
      <span class="label">グルメ度</span>
      <span class="gourmet" id="hud-gourmet">★0</span>
    </div>
    <div class="stat">
      <span class="label">のこりマス</span>
      <span class="turn" id="hud-remain">--</span>
    </div>
  </div>

  <!-- ===== ボード ===== -->
  <div id="board-wrap">
    <button id="sound-toggle" class="pixtext">♪ ON</button>
    <div id="legend" class="pixtext">
      <div><span style="background:#ff77b7"></span>グルメ</div>
      <div><span style="background:#7ec0ff"></span>イベント</div>
      <div><span style="background:#caa86a"></span>名所</div>
    </div>
    <div id="board">
      <div id="piece">🚗</div>
    </div>
  </div>

  <!-- ===== コントロール ===== -->
  <div id="controls">
    <div id="roulette">
      <div class="needle"></div>
      <div class="ring" id="ring"></div>
      <div class="hub" id="hub">?</div>
    </div>
    <div id="btn-area">
      <button class="btn" id="spin-btn">ルーレットを まわす</button>
      <div id="dice-msg" class="pixtext">START を おしてね</div>
    </div>
  </div>

  <!-- ===== イベントダイアログ ===== -->
  <div class="overlay" id="dialog">
    <div class="window pixtext">
      <h2 id="dlg-title">タイトル</h2>
      <div class="ico-big" id="dlg-ico">🍙</div>
      <p id="dlg-body">本文</p>
      <div class="delta" id="dlg-delta"></div>
      <p class="note" id="dlg-note"></p>
      <button class="btn blue" id="dlg-ok">つぎへ ▶</button>
    </div>
  </div>

  <!-- ===== ゴールダイアログ ===== -->
  <div class="overlay" id="goal-dialog">
    <div class="window pixtext">
      <h2 id="goal-title">ゴール！</h2>
      <div class="ico-big">🏁</div>
      <p id="goal-body"></p>
      <button class="btn" id="goal-invader" style="background:var(--nes-green);box-shadow:0 4px 0 #1f7a1f,inset 0 0 0 2px rgba(255,255,255,.25);">🕶️ サングラス インベーダー</button>
      <button class="btn blue" id="goal-restart">もういちど あそぶ</button>
    </div>
  </div>

  <!-- ===== サングラス・インベーダー ===== -->
  <div class="overlay" id="invader-overlay" style="flex-direction:column;padding:0;background:#000;">
    <div id="inv-hud" class="pixtext">
      <span id="inv-score">SCORE 0</span>
      <span id="inv-wave">WAVE 1</span>
      <span id="inv-life">🚀×3</span>
    </div>
    <canvas id="inv-canvas"></canvas>
    <div id="inv-pad">
      <button class="ipad" id="inv-left">◀</button>
      <button class="ipad fire" id="inv-fire">FIRE</button>
      <button class="ipad" id="inv-right">▶</button>
    </div>
    <div id="inv-msg" class="overlay" style="background:rgba(0,0,10,.8);">
      <div class="window pixtext">
        <h2 id="inv-msg-title">GAME OVER</h2>
        <div class="ico-big" id="inv-msg-ico">🕶️</div>
        <p id="inv-msg-body"></p>
        <button class="btn" id="inv-msg-retry">もういちど</button>
        <button class="btn blue" id="inv-msg-back">マップへ もどる</button>
      </div>
    </div>
  </div>

</div>

<script>
"use strict";
/* =========================================================================
   【グルメスポット データ】 ★ここを編集してください★
   -------------------------------------------------------------------------
   重要：下記の店名・ジャンル等は「サンプル（要確認）」のプレースホルダーです。
   実在店舗の正確な情報（店名・営業時間・価格・所在）は各自でご確認のうえ、
   この配列を書き換えてご利用ください。
   ※乃木神社・国立新美術館は乃木坂駅に近接する実在の施設（名所マス）です。
   -------------------------------------------------------------------------
   type : "start"  スタート
          "goal"   ゴール
          "food"   グルメ（gourmet度UP、料金支払い）
          "event"  ランダムイベント
          "land"   名所・休憩（実在ランドマーク等）
   ico  : 絵文字アイコン
   name : マスに表示する短い名前
   desc : 止まったときのメッセージ
   cost : 支払う金額（food用 / 円）   gourmet: 上がるグルメ度（food用）
   money: 増減する金額（event用、+/-）
   ========================================================================= */
const SPOTS = [
  { type:"start", ico:"🚉", name:"乃木坂駅",  desc:"乃木坂駅をスタート！グルメの旅へ出発だ。" },

  { type:"food",  ico:"☕", name:"喫茶店",    desc:"レトロな喫茶店でモーニング。【サンプル】",  cost:800,  gourmet:1 },
  { type:"event", ico:"💰", name:"おこづかい", desc:"道で財布を拾い、交番に届けたらお礼をもらった！", money:+1000 },
  { type:"food",  ico:"🍜", name:"ラーメン",   desc:"こってり一杯で腹ごしらえ。【サンプル】",      cost:1000, gourmet:2 },
  { type:"land",  ico:"⛩️", name:"乃木神社",   desc:"乃木坂駅すぐの乃木神社で旅の安全を祈願。ひと休み。" },

  { type:"food",  ico:"🍰", name:"パティスリー", desc:"評判のケーキでひとやすみ。【サンプル】",   cost:1200, gourmet:2 },
  { type:"event", ico:"🌧️", name:"とつぜんの雨", desc:"傘を買うはめに…痛い出費。",                  money:-700 },
  { type:"food",  ico:"🍣", name:"寿司",       desc:"カウンターで握りを堪能。【サンプル】",        cost:3000, gourmet:4 },
  { type:"land",  ico:"🖼️", name:"国立新美術館", desc:"乃木坂駅直結の国立新美術館でアート鑑賞。リフレッシュ！" },

  { type:"food",  ico:"🍝", name:"イタリアン", desc:"本格パスタでランチ。【サンプル】",            cost:1500, gourmet:3 },
  { type:"event", ico:"🎁", name:"クーポン",   desc:"グルメサイトのクーポンが当たった！",          money:+1500 },
  { type:"food",  ico:"🍖", name:"焼肉",       desc:"上カルビで贅沢ディナー。【サンプル】",        cost:4000, gourmet:5 },
  { type:"event", ico:"💸", name:"わすれもの", desc:"スマホを置き忘れ、取りに戻る交通費が…",       money:-500 },

  { type:"food",  ico:"🥖", name:"ベーカリー", desc:"焼きたてパンをテイクアウト。【サンプル】",    cost:900,  gourmet:1 },
  { type:"food",  ico:"🍦", name:"ジェラート", desc:"散歩のおともに一口アイス。【サンプル】",      cost:600,  gourmet:1 },
  { type:"event", ico:"⭐", name:"グルメ評論", desc:"あなたの食レポがバズった！グルメ度アップ！",  money:0, gbonus:3 },
  { type:"food",  ico:"🍶", name:"和食処",     desc:"季節の会席で舌つづみ。【サンプル】",          cost:5000, gourmet:6 },

  { type:"food",  ico:"🍛", name:"カレー",     desc:"スパイス香るカレーで〆。【サンプル】",        cost:1100, gourmet:2 },
  { type:"event", ico:"🎫", name:"ミュージアム", desc:"展示チケット代を支払った。",                money:-1600 },
  { type:"food",  ico:"🍵", name:"甘味処",     desc:"あんみつでほっこり。【サンプル】",            cost:850,  gourmet:1 },

  { type:"goal",  ico:"🏁", name:"ゴール",     desc:"乃木坂グルメ巡り、完食！おつかれさま！" }
];

/* ===================== ゲーム状態 ===================== */
const state = {
  pos: 0,
  money: 3000,
  gourmet: 0,
  moving: false,
  started: false
};

/* ===================== ボード生成（つづら折れ配置） ===================== */
const CELL = 64, GAP_X = 76, GAP_Y = 84, COLS = 5, PADX = 12, PADY = 12;
const cellEls = [];
const board = document.getElementById("board");
const piece = document.getElementById("piece");

function cellPos(i){
  const row = Math.floor(i / COLS);
  let col = i % COLS;
  if (row % 2 === 1) col = (COLS - 1) - col; // 蛇行
  return { x: PADX + col * GAP_X, y: PADY + row * GAP_Y };
}

function buildBoard(){
  // 道（ドット）を先に描く
  for (let i = 0; i < SPOTS.length - 1; i++){
    const a = cellPos(i), b = cellPos(i+1);
    const ax = a.x + CELL/2, ay = a.y + CELL/2;
    const bx = b.x + CELL/2, by = b.y + CELL/2;
    for (let t = 1; t <= 3; t++){
      const dot = document.createElement("div");
      dot.className = "path-dot";
      dot.style.left = (ax + (bx-ax)*(t/4) - 4) + "px";
      dot.style.top  = (ay + (by-ay)*(t/4) - 4) + "px";
      board.appendChild(dot);
    }
  }
  // マス
  SPOTS.forEach((s, i) => {
    const p = cellPos(i);
    const el = document.createElement("div");
    el.className = "cell " + s.type;
    el.style.left = p.x + "px";
    el.style.top  = p.y + "px";
    el.innerHTML = `<div class="ico">${s.ico}</div><div class="nm">${s.name}</div>`;
    board.appendChild(el);
    cellEls.push(el);
  });
  // ボード全体の高さを確保
  const rows = Math.ceil(SPOTS.length / COLS);
  board.style.height = (PADY + rows * GAP_Y) + "px";
  board.style.width  = (PADX + COLS * GAP_X) + "px";
}

function placePiece(i, anim=true){
  const p = cellPos(i);
  piece.style.left = (p.x + CELL/2 - 17) + "px";
  piece.style.top  = (p.y + CELL/2 - 30) + "px";
  centerOn(i, anim);
}

/* 駒が画面中央付近に来るようボードをスクロール */
function centerOn(i, anim=true){
  const wrap = document.getElementById("board-wrap");
  const p = cellPos(i);
  const targetY = wrap.clientHeight/2 - (p.y + CELL/2);
  const targetX = wrap.clientWidth/2  - (p.x + CELL/2);
  const minY = Math.min(0, wrap.clientHeight - parseFloat(board.style.height));
  const minX = Math.min(0, wrap.clientWidth  - parseFloat(board.style.width));
  const ty = Math.max(minY, Math.min(0, targetY));
  const tx = Math.max(minX, Math.min(0, targetX));
  board.style.transition = anim ? "transform .35s ease-out" : "none";
  board.style.transform = `translate(${tx}px,${ty}px)`;
}

/* ===================== サウンド（WebAudio ファミコン風） ===================== */
let audioOn = true;
let actx = null;
function beep(freq, dur, type="square", vol=0.08){
  if (!audioOn) return;
  try{
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(actx.destination);
    const now = actx.currentTime;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.start(now); o.stop(now + dur);
  }catch(e){}
}
function sfxMove(){ beep(660, .06); }
function sfxGood(){ beep(523,.08); setTimeout(()=>beep(659,.08),90); setTimeout(()=>beep(784,.12),180); }
function sfxBad(){ beep(330,.12,"sawtooth"); setTimeout(()=>beep(220,.18,"sawtooth"),120); }
function sfxSpin(){ beep(880,.04); }
function sfxStart(){ beep(523,.1); setTimeout(()=>beep(659,.1),110); setTimeout(()=>beep(784,.1),220); setTimeout(()=>beep(1046,.2),330); }

/* ===================== HUD更新 ===================== */
function fmtYen(n){ return "¥" + n.toLocaleString("ja-JP"); }
function updateHUD(){
  document.getElementById("hud-money").textContent = fmtYen(state.money);
  document.getElementById("hud-gourmet").textContent = "★" + state.gourmet;
  document.getElementById("hud-remain").textContent = (SPOTS.length - 1 - state.pos);
  const m = document.getElementById("hud-money");
  m.style.color = state.money < 0 ? "var(--nes-red)" : "var(--nes-yellow)";
}

/* ===================== ルーレット ===================== */
const ring = document.getElementById("ring");
const hub = document.getElementById("hub");
const spinBtn = document.getElementById("spin-btn");
const diceMsg = document.getElementById("dice-msg");
let ringRot = 0;

function spin(){
  if (state.moving) return;
  state.moving = true;
  spinBtn.disabled = true;
  diceMsg.textContent = "ルーレット かいてんちゅう…";
  hub.textContent = "?";

  const steps = 1 + Math.floor(Math.random() * 6); // 1〜6
  // 演出用：ランダムにぐるぐる回す
  ringRot += 360 * (3 + Math.floor(Math.random()*3)) + Math.floor(Math.random()*360);
  ring.style.transform = `rotate(${ringRot}deg)`;

  // 回転中のSE
  let t = 0;
  const si = setInterval(()=>{ sfxSpin(); if(++t>10) clearInterval(si); }, 140);

  setTimeout(() => {
    clearInterval(si);
    hub.textContent = steps;
    diceMsg.textContent = steps + " マス すすむ！";
    sfxGood();
    setTimeout(() => moveSteps(steps), 500);
  }, 1700);
}

/* ===================== 駒を1マスずつ進める ===================== */
function moveSteps(n){
  let remaining = n;
  function step(){
    if (remaining <= 0){
      arrive();
      return;
    }
    if (state.pos < SPOTS.length - 1){
      state.pos++;
      sfxMove();
      bumpCell(state.pos);
      placePiece(state.pos);
      updateHUD();
    }
    remaining--;
    if (state.pos >= SPOTS.length - 1){
      setTimeout(arrive, 250); // ゴール到達
      return;
    }
    setTimeout(step, 230);
  }
  step();
}

function bumpCell(i){
  const el = cellEls[i];
  el.animate(
    [{transform:"scale(1)"},{transform:"scale(1.18)"},{transform:"scale(1)"}],
    {duration:200}
  );
}

/* ===================== 到着時のイベント処理 ===================== */
function arrive(){
  const spot = SPOTS[state.pos];

  if (spot.type === "goal"){
    finishGame();
    return;
  }

  if (spot.type === "food"){
    state.money -= (spot.cost || 0);
    state.gourmet += (spot.gourmet || 0);
    showDialog({
      title: spot.name,
      ico: spot.ico,
      body: spot.desc,
      delta: `-${fmtYen(spot.cost||0)}　グルメ度 +${spot.gourmet||0}★`,
      deltaType: "minus-mix",
      note: "※価格・内容はサンプルです。実際の情報はご確認ください。"
    });
    sfxBad(); // お金が減る音 → でもグルメ度UP
  }
  else if (spot.type === "event"){
    const dm = spot.money || 0;
    const gb = spot.gbonus || 0;
    state.money += dm;
    state.gourmet += gb;
    let deltaTxt = "";
    if (dm !== 0) deltaTxt += (dm>0?`+${fmtYen(dm)}`:`-${fmtYen(-dm)}`);
    if (gb !== 0) deltaTxt += (deltaTxt?"　":"") + `グルメ度 +${gb}★`;
    showDialog({
      title: spot.name,
      ico: spot.ico,
      body: spot.desc,
      delta: deltaTxt,
      deltaType: (dm>0||gb>0) ? "plus" : "minus"
    });
    (dm>0||gb>0) ? sfxGood() : sfxBad();
  }
  else { // land / start
    showDialog({
      title: spot.name,
      ico: spot.ico,
      body: spot.desc,
      delta: "",
      deltaType: "plus"
    });
    sfxGood();
  }
  updateHUD();
}

/* ===================== ダイアログ ===================== */
const dlg = document.getElementById("dialog");
function showDialog({title, ico, body, delta, deltaType, note}){
  document.getElementById("dlg-title").textContent = title;
  document.getElementById("dlg-ico").textContent = ico;
  document.getElementById("dlg-body").textContent = body;
  const d = document.getElementById("dlg-delta");
  d.textContent = delta || "";
  d.className = "delta " + (deltaType==="minus"?"minus":deltaType==="plus"?"plus":"");
  if (deltaType === "minus-mix") d.className = "delta";
  document.getElementById("dlg-note").textContent = note || "";
  dlg.classList.add("show");
}
document.getElementById("dlg-ok").addEventListener("click", () => {
  dlg.classList.remove("show");
  beep(700,.05);
  state.moving = false;
  spinBtn.disabled = false;
  diceMsg.textContent = "もういちど まわそう！";
});

/* ===================== ゴール ===================== */
function finishGame(){
  sfxStart();
  let rank, msg;
  const g = state.gourmet, m = state.money;
  if (g >= 25) rank = "グルメマスター";
  else if (g >= 15) rank = "グルメ通";
  else if (g >= 8)  rank = "食いしんぼう";
  else rank = "おさんぽ気分";

  msg = `グルメ度：★${g}\nしょじきん：${fmtYen(m)}\n\nあなたの称号は\n「${rank}」！`;
  if (m < 0) msg += "\n\n…ただし お金は使いすぎ注意！";

  document.getElementById("goal-body").textContent = msg;
  document.getElementById("goal-dialog").classList.add("show");
}
document.getElementById("goal-restart").addEventListener("click", () => {
  document.getElementById("goal-dialog").classList.remove("show");
  resetGame();
});

function resetGame(){
  state.pos = 0; state.money = 3000; state.gourmet = 0; state.moving = false;
  placePiece(0);
  updateHUD();
  spinBtn.disabled = false;
  diceMsg.textContent = "ルーレットを まわそう！";
  hub.textContent = "?";
}

/* ===================== サウンドトグル ===================== */
document.getElementById("sound-toggle").addEventListener("click", (e)=>{
  audioOn = !audioOn;
  e.target.textContent = audioOn ? "♪ ON" : "♪ OFF";
  if (audioOn) beep(880,.06);
});

/* ===================== タイトル → ゲーム開始 ===================== */
function startGame(){
  if (state.started) return;
  state.started = true;
  sfxStart();
  document.getElementById("title").style.display = "none";
  setTimeout(()=>{ placePiece(0, false); centerOn(0,false); }, 50);
  diceMsg.textContent = "ルーレットを まわそう！";
}
document.getElementById("title").addEventListener("click", startGame);
document.addEventListener("keydown", (e)=>{
  if (!state.started && (e.key==="Enter"||e.key===" ")) startGame();
});

spinBtn.addEventListener("click", spin);

/* =========================================================================
   サングラス・インベーダー  (ゴール後に遊べるおまけゲーム)
   ========================================================================= */
const INV = {
  canvas:null, ctx:null, W:0, H:0,
  raf:null, running:false,
  player:null, bullets:[], enemyBullets:[], invaders:[],
  dir:1, score:0, wave:1, lives:3,
  moveLeft:false, moveRight:false, lastShot:0,
  enemyStepTimer:0, enemyShotTimer:0,
  // いろいろな種類のサングラス（撃ち落とす的）
  glasses:[
    {ico:"🕶️", pts:30}, // ウェリントン風（濃色）
    {ico:"😎", pts:20}, // フェイス付きサングラス
    {ico:"🥽", pts:50}, // ゴーグル型
    {ico:"👓", pts:10}  // クリアフレーム
  ]
};

function invInit(){
  const c = document.getElementById("inv-canvas");
  INV.canvas = c; INV.ctx = c.getContext("2d");
  invResize();
  window.addEventListener("resize", invResize);

  // 操作（タッチ＆マウス）
  const L = document.getElementById("inv-left");
  const R = document.getElementById("inv-right");
  const F = document.getElementById("inv-fire");
  const press = (el, on)=>{
    const start=(e)=>{ e.preventDefault(); on(true); };
    const end=(e)=>{ e.preventDefault(); on(false); };
    el.addEventListener("touchstart",start,{passive:false});
    el.addEventListener("touchend",end,{passive:false});
    el.addEventListener("mousedown",start);
    el.addEventListener("mouseup",end);
    el.addEventListener("mouseleave",end);
  };
  press(L, v=>INV.moveLeft=v);
  press(R, v=>INV.moveRight=v);
  F.addEventListener("touchstart",(e)=>{e.preventDefault();invShoot();},{passive:false});
  F.addEventListener("mousedown",(e)=>{e.preventDefault();invShoot();});

  // キーボード
  document.addEventListener("keydown",(e)=>{
    if(!INV.running) return;
    if(e.key==="ArrowLeft") INV.moveLeft=true;
    if(e.key==="ArrowRight") INV.moveRight=true;
    if(e.key===" "||e.key==="ArrowUp"){ e.preventDefault(); invShoot(); }
  });
  document.addEventListener("keyup",(e)=>{
    if(e.key==="ArrowLeft") INV.moveLeft=false;
    if(e.key==="ArrowRight") INV.moveRight=false;
  });

  document.getElementById("inv-msg-retry").addEventListener("click",()=>{
    document.getElementById("inv-msg").classList.remove("show");
    invStart();
  });
  document.getElementById("inv-msg-back").addEventListener("click",()=>{
    document.getElementById("inv-msg").classList.remove("show");
    invStop();
    document.getElementById("invader-overlay").classList.remove("show");
    resetGame();
  });
}

function invResize(){
  const c = INV.canvas;
  const rect = c.getBoundingClientRect();
  c.width = rect.width; c.height = rect.height;
  INV.W = c.width; INV.H = c.height;
  if(INV.player){ INV.player.y = INV.H - 46; }
}

function invStart(){
  INV.score = 0; INV.wave = 1; INV.lives = 3;
  invSpawnWave();
  INV.player = { x: INV.W/2, y: INV.H-46, w:30, h:30, speed:5 };
  INV.bullets = []; INV.enemyBullets = []; INV.dir = 1;
  INV.running = true;
  invUpdateHUD();
  if(INV.raf) cancelAnimationFrame(INV.raf);
  invLoop();
}

function invSpawnWave(){
  INV.invaders = [];
  const cols = 7, rows = 4;
  const gx = INV.W / (cols+1);
  const startY = 50;
  for(let r=0; r<rows; r++){
    const g = INV.glasses[r % INV.glasses.length];
    for(let cI=0; cI<cols; cI++){
      INV.invaders.push({
        x: gx*(cI+1), y: startY + r*42,
        w:28, h:28, alive:true, ico:g.ico, pts:g.pts
      });
    }
  }
  INV.enemyStepTimer = 0;
  INV.enemySpeed = 14 + INV.wave*2;
}

function invShoot(){
  if(!INV.running) return;
  // 連射制限（時間ベース）
  const now = (INV._t||0);
  if(INV.bullets.length >= 3) return;
  INV.bullets.push({ x:INV.player.x, y:INV.player.y-16, w:4, h:12, v:-8 });
  beep(990,.04);
}

function invUpdateHUD(){
  document.getElementById("inv-score").textContent = "SCORE " + INV.score;
  document.getElementById("inv-wave").textContent = "WAVE " + INV.wave;
  document.getElementById("inv-life").textContent = "🚀×" + INV.lives;
}

let invFrame = 0;
function invLoop(){
  if(!INV.running) return;
  invFrame++;
  const ctx = INV.ctx, W=INV.W, H=INV.H;
  ctx.clearRect(0,0,W,H);

  // 星空背景
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.5)";
  for(let i=0;i<24;i++){
    const sx=(i*73%W), sy=((i*131 + invFrame*0.6)%H);
    ctx.fillRect(sx, sy, 2, 2);
  }

  // プレイヤー移動
  const p = INV.player;
  if(INV.moveLeft)  p.x -= p.speed;
  if(INV.moveRight) p.x += p.speed;
  p.x = Math.max(18, Math.min(W-18, p.x));

  // プレイヤー描画（ロケット）
  ctx.font = "30px serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("🚀", p.x, p.y);

  // インベーダーの隊列移動（ステップ式）
  INV.enemyStepTimer++;
  let stepInterval = Math.max(8, 34 - INV.wave*3 - (countAlive()<8?12:0));
  let dropNow=false;
  if(INV.enemyStepTimer >= stepInterval){
    INV.enemyStepTimer = 0;
    // 端に当たっているか確認
    let minX=1e9, maxX=-1e9;
    INV.invaders.forEach(v=>{ if(v.alive){ minX=Math.min(minX,v.x); maxX=Math.max(maxX,v.x);}});
    if(maxX + 20 > W && INV.dir>0){ dropNow=true; INV.dir=-1; }
    else if(minX - 20 < 0 && INV.dir<0){ dropNow=true; INV.dir=1; }
    INV.invaders.forEach(v=>{
      if(!v.alive) return;
      v.x += INV.dir*16;
      if(dropNow) v.y += 22;
    });
    if(countAlive()>0) beep(140,.03,"square",.04);
  }

  // インベーダー描画＆ゲームオーバー判定
  ctx.font = "26px serif";
  let reached=false;
  INV.invaders.forEach(v=>{
    if(!v.alive) return;
    ctx.fillText(v.ico, v.x, v.y);
    if(v.y + 14 >= p.y - 10) reached=true;
  });
  if(reached){ invEnd(false); return; }

  // 敵の弾発射
  INV.enemyShotTimer++;
  if(INV.enemyShotTimer > Math.max(28, 70 - INV.wave*5)){
    INV.enemyShotTimer = 0;
    const alive = INV.invaders.filter(v=>v.alive);
    if(alive.length){
      const shooter = alive[Math.floor((invFrame*7)%alive.length)];
      INV.enemyBullets.push({x:shooter.x, y:shooter.y+14, w:4, h:12, v:4.5});
    }
  }

  // 自弾の更新＆当たり判定
  ctx.fillStyle = "var(--nes-yellow)";
  INV.bullets.forEach(b=>{ b.y += b.v; });
  INV.bullets = INV.bullets.filter(b=>b.y > -20);
  INV.bullets.forEach(b=>{
    ctx.fillStyle = "#fbd000";
    ctx.fillRect(b.x-2, b.y, 4, 12);
    INV.invaders.forEach(v=>{
      if(v.alive && Math.abs(v.x-b.x)<18 && Math.abs(v.y-b.y)<16){
        v.alive=false; b.y=-999; INV.score += v.pts;
        beep(660,.05); setTimeout(()=>beep(880,.05),50);
        invUpdateHUD();
      }
    });
  });

  // 敵弾の更新＆当たり判定
  INV.enemyBullets.forEach(b=>{ b.y += b.v; });
  INV.enemyBullets = INV.enemyBullets.filter(b=>b.y < H+20);
  INV.enemyBullets.forEach(b=>{
    ctx.fillStyle = "#ff77b7";
    ctx.fillRect(b.x-2, b.y, 4, 12);
    if(Math.abs(b.x-p.x)<18 && Math.abs(b.y-p.y)<18){
      b.y = H+999;
      INV.lives--;
      invUpdateHUD();
      sfxBad();
      if(INV.lives<=0){ invEnd(false); return; }
    }
  });

  // 死亡などでループ停止済みなら抜ける
  if(!INV.running) return;

  // ウェーブクリア判定
  if(countAlive()===0){
    INV.wave++;
    INV.score += 100;
    invUpdateHUD();
    beep(523,.1); setTimeout(()=>beep(784,.15),120);
    invSpawnWave();
  }

  INV.raf = requestAnimationFrame(invLoop);
}

function countAlive(){ return INV.invaders.filter(v=>v.alive).length; }

function invEnd(win){
  INV.running = false;
  if(INV.raf) cancelAnimationFrame(INV.raf);
  document.getElementById("inv-msg-title").textContent = win ? "CLEAR!" : "GAME OVER";
  document.getElementById("inv-msg-ico").textContent = win ? "🏆" : "🕶️";
  document.getElementById("inv-msg-body").textContent =
    "スコア：" + INV.score + "\nウェーブ：" + INV.wave;
  document.getElementById("inv-msg").classList.add("show");
  win ? sfxStart() : sfxBad();
}

function invStop(){
  INV.running=false;
  if(INV.raf) cancelAnimationFrame(INV.raf);
}

// ゴールダイアログから起動
document.getElementById("goal-invader").addEventListener("click",()=>{
  document.getElementById("goal-dialog").classList.remove("show");
  document.getElementById("invader-overlay").classList.add("show");
  // canvasの実サイズ確定を待って開始
  requestAnimationFrame(()=>{ invResize(); invStart(); });
});

/* ===================== 初期化 ===================== */
buildBoard();
invInit();
placePiece(0, false);
updateHUD();
window.addEventListener("resize", ()=>{ if(state.started) centerOn(state.pos,false); });
</script>
