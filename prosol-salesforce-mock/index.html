<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日進ProSOL 案件管理モック</title>
<style>
/* =========================================================
   株式会社日進ProSOL様 Salesforce構築プロジェクト
   画面モック（Lightning Experience 風 / 単一HTML・外部依存なし）
   作成：thomas株式会社
   ※表示データはすべて架空のデモデータです
   ========================================================= */
:root{
  --brand:#0176d3; --brand-dark:#014486; --brand-light:#d8edff;
  --bg:#f3f3f3; --card:#fff; --border:#dddbda; --border-light:#e5e5e5;
  --text:#181818; --text-weak:#3e3e3c; --text-mute:#706e6b;
  --green:#2e844a; --green-bg:#cdefc4; --yellow:#dd7a01; --yellow-bg:#fef1cd;
  --red:#ba0517; --red-bg:#feded8; --purple:#5a1ba9;
  --path-done:#3ba755; --path-cur:#014486;
  --custom:#3c9662; --std:#1b96ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Salesforce Sans","Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo",-apple-system,"Segoe UI",sans-serif;
  font-size:13px;color:var(--text);background:var(--bg);line-height:1.5}
a{color:var(--brand);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:13px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}

/* ---------- デモバナー ---------- */
.demo-banner{background:#032d60;color:#fff;font-size:12px;padding:4px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.demo-banner b{color:#90d0fe}

/* ---------- グローバルヘッダー ---------- */
.g-header{background:#fff;height:50px;display:flex;align-items:center;padding:0 12px;gap:12px;border-bottom:1px solid var(--border)}
.icon-btn:disabled{opacity:.35;cursor:default}
a.logo{text-decoration:none}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--brand-dark);white-space:nowrap}
.logo .mark{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,#0176d3,#3ba755);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.g-search{flex:1;max-width:560px;margin:0 auto;position:relative}
.g-search input{width:100%;border:1px solid var(--border);border-radius:4px;padding:6px 10px 6px 30px;background:#fff}
.g-search::before{content:"🔍";position:absolute;left:9px;top:6px;font-size:12px;opacity:.6}
.g-tools{display:flex;align-items:center;gap:10px}
.icon-btn{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center}
.badge-count{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;line-height:16px}
.role-select{border:1px solid var(--border);border-radius:4px;padding:5px 8px;background:#fff}
.avatar{width:32px;height:32px;border-radius:50%;background:#b0adab;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}

/* ---------- アプリナビ ---------- */
.app-nav{background:#fff;border-bottom:3px solid var(--brand);display:flex;align-items:stretch;height:40px;padding-left:12px;box-shadow:0 2px 2px rgba(0,0,0,.06);overflow-x:auto}
.app-name{display:flex;align-items:center;gap:8px;padding-right:18px;margin-right:6px;font-size:16px;white-space:nowrap}
.app-name .grid{font-size:16px;color:var(--text-mute)}
.nav-item{display:flex;align-items:center;padding:0 12px;color:var(--text);border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap}
.nav-item:hover{background:#f3f3f3;text-decoration:none}
.nav-item.active{border-bottom-color:var(--brand-dark);font-weight:700;background:#f3f9ff}

/* ---------- レイアウト ---------- */
main{padding:12px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:4px;box-shadow:0 2px 2px rgba(0,0,0,.05);margin-bottom:12px}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;font-size:14px}
.card-h .right{margin-left:auto;display:flex;gap:6px;font-weight:400}
.card-b{padding:0 12px 12px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1000px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.grid2>*,.grid3>*,.grid4>*{min-width:0}
@media(max-width:700px){.path{flex-wrap:wrap}.path ol{overflow-x:auto;flex-basis:100%}.path li{min-width:96px}.path .btn{width:100%}main{padding:12px 16px}.g-tools label{display:none}.toast{top:auto;bottom:16px;min-width:0;width:calc(100vw - 32px)}.g-header{gap:6px;padding:0 8px}.g-search{min-width:0}.role-select{max-width:84px;padding:5px 4px}.notif-panel{right:8px}main .obj-map{grid-template-columns:1fr}.logo span{display:none}.g-tools{margin-left:auto}.tbl{min-width:640px}.bar-chart .row{grid-template-columns:110px 1fr 56px!important}.fields{grid-template-columns:1fr}.notif-panel{right:8px;width:calc(100vw - 16px)}.app-name{font-size:14px}.page-h h1{font-size:16px}}

.obj-icon{width:28px;height:28px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0}
.obj-icon.sm{width:22px;height:22px;font-size:12px}
.i-project{background:#3c9662}.i-opp{background:#ff5d2d}.i-acc{background:#5867e8}.i-contact{background:#a094ed}
.i-hear{background:#0b827c}.i-req{background:#e3066a}.i-case{background:#f2cf5b;color:#333}.i-know{background:#ec94ed}
.i-kakou{background:#e86e4a}.i-kian{background:#4a74e8}.i-sekkei{background:#d1446b}.i-seizou{background:#7a5af5}.i-chou{background:#06a59a}
.i-kousu{background:#747474}.i-report{background:#2e844a}.i-prod{background:#b781d3}.i-quote{background:#88c651}

/* ---------- ボタン ---------- */
.btn{border:1px solid var(--border);background:#fff;color:var(--brand);border-radius:4px;padding:4px 12px;line-height:22px;white-space:nowrap}
.btn:hover{background:#f3f3f3}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.brand:hover{background:var(--brand-dark)}
.btn.success{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red)}
.btn-group{display:inline-flex}
.btn-group .btn{border-radius:0;margin-left:-1px}
.btn-group .btn:first-child{border-radius:4px 0 0 4px;margin-left:0}
.btn-group .btn:last-child{border-radius:0 4px 4px 0}

/* ---------- ページヘッダー ---------- */
.page-h{background:#fff;border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:12px;box-shadow:0 2px 2px rgba(0,0,0,.05)}
.page-h .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-h .obj-label{font-size:12px;color:var(--text-weak)}
.page-h h1{font-size:18px;font-weight:700;line-height:1.3}
.page-h .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.highlights{display:flex;gap:28px;margin-top:12px;flex-wrap:wrap}
.highlights .f .l{font-size:12px;color:var(--text-mute)}
.highlights .f .v{font-size:13px}

/* ---------- パス ---------- */
.path{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:4px;padding:10px 12px;margin-bottom:12px}
.path ol{display:flex;flex:1;list-style:none;min-width:0}
.path li{flex:1;position:relative;height:32px;margin-right:6px;background:#ecebea;color:var(--text);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%);white-space:nowrap;overflow:hidden;padding:0 14px}
.path li:first-child{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);border-radius:16px 0 0 16px}
.path li:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,10px 50%);border-radius:0 16px 16px 0;margin-right:0}
.path li.done{background:var(--path-done);color:#fff}
.path li.cur{background:var(--path-cur);color:#fff;font-weight:700}
.path li.rej{background:var(--red);color:#fff;font-weight:700}
.path li.sel{outline:none;box-shadow:inset 0 0 0 2px #000}
.path li:hover:not(.cur){filter:brightness(.95)}

/* ---------- タブ ---------- */
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 12px;overflow-x:auto}
.tab{padding:10px 14px;color:var(--text-weak);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--brand)}
.tab.active{color:var(--text);border-bottom-color:var(--brand);font-weight:700}
.tab-body{padding:12px}

/* ---------- テーブル ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:#fafaf9;color:var(--text-weak);font-weight:700;text-align:left;padding:6px 8px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--border-light);vertical-align:middle}
.tbl tr:hover td{background:#f3f9ff}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;background:#fafaf9}

/* ---------- 項目（詳細） ---------- */
.fields{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.field{border-bottom:1px solid var(--border-light);padding:6px 2px}
.field .l{font-size:12px;color:var(--text-mute)}
.field .v{min-height:20px}
.section-title{background:#f3f3f3;border-radius:4px;padding:4px 10px;font-weight:700;margin:12px 0 6px;font-size:13px}

/* ---------- ピル・ランプ ---------- */
.pill{display:inline-block;border-radius:12px;padding:0 8px;font-size:11.5px;line-height:20px;background:#ecebea;white-space:nowrap}
.pill.g{background:var(--green-bg);color:#194e31}.pill.y{background:var(--yellow-bg);color:#8c4b02}.pill.r{background:var(--red-bg);color:#8e030f}
.pill.b{background:var(--brand-light);color:var(--brand-dark)}
.lamps{display:inline-flex;gap:3px;vertical-align:middle}
.lamp{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.lamp.g{background:#45c65a}.lamp.y{background:#fcc003}.lamp.r{background:#ea001e}
.lamp-legend{font-size:11.5px;color:var(--text-mute)}

/* ---------- カンバン ---------- */
.kanban{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.k-col{min-width:220px;flex:1;background:#f3f3f3;border-radius:4px}
.k-col-h{background:var(--brand-dark);color:#fff;font-weight:700;text-align:center;padding:6px;font-size:12.5px;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%)}
.k-col:first-child .k-col-h{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);border-radius:14px 0 0 14px}
.k-col-b{padding:6px;min-height:120px}
.k-col-b.drag-over{background:#d8edff}
.k-card{background:#fff;border:1px solid var(--border);border-radius:4px;padding:8px;margin-bottom:6px;cursor:grab;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.k-card:hover{border-color:var(--brand)}
.k-card .t{font-size:12.5px;color:var(--brand);font-weight:700;margin-bottom:2px}
.k-card .s{font-size:11.5px;color:var(--text-mute)}
.k-card .row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}

/* ---------- KPI ---------- */
.kpi{padding:12px}
.kpi .l{color:var(--text-mute);font-size:12px}
.kpi .v{font-size:26px;font-weight:300;line-height:1.3}
.kpi .s{font-size:11.5px;color:var(--text-mute)}

/* ---------- ガント ---------- */
.gantt{position:relative;font-size:11.5px}
.g-row{display:grid;grid-template-columns:160px 1fr;align-items:center;border-bottom:1px solid var(--border-light);min-height:28px}
.g-row .g-name{padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-track{position:relative;height:28px}
.g-bar{position:absolute;top:7px;height:14px;border-radius:3px;opacity:.9}
.g-bar.plan{background:#c9c7c5}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:2}
.g-head{display:grid;grid-template-columns:160px 1fr;font-weight:700;color:var(--text-mute)}
.g-months{position:relative;height:22px}
.g-months span{position:absolute;top:2px;border-left:1px solid var(--border);padding-left:4px}

/* ---------- ヒアリングシート ---------- */
.hs-layout{display:grid;grid-template-columns:240px 1fr 300px;gap:12px}
@media(max-width:1100px){.hs-layout{grid-template-columns:1fr}}
.layer-nav{list-style:none}
.layer-nav li{padding:8px 10px;border-left:3px solid transparent;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.layer-nav li:hover{background:#f3f9ff}
.layer-nav li.active{border-left-color:var(--brand);background:#f3f9ff;font-weight:700}
.layer-nav .prog{font-size:11px;color:var(--text-mute);font-weight:400}
.q{border:1px solid var(--border-light);border-radius:4px;padding:10px 12px;margin-bottom:8px;background:#fff;transition:background .4s}
.q.new{background:#fff8e1;border-color:#fcc003}
.q.focus{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.q .ql{font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.q .req{color:var(--red)}
.q .branch{font-size:11px;color:#8c4b02;background:var(--yellow-bg);border-radius:10px;padding:0 6px;font-weight:400}
.q .why-btn{font-size:11px;font-weight:400;margin-left:auto}
.q input[type=text],.q input[type=number],.q input[type=date],.q select,.q textarea{width:100%;border:1px solid var(--border);border-radius:4px;padding:5px 8px;background:#fff}
.radio-row{display:flex;flex-wrap:wrap;gap:6px}
.radio-row label{border:1px solid var(--border);border-radius:16px;padding:3px 12px;cursor:pointer;user-select:none}
.radio-row input{display:none}
.radio-row input:checked+span{color:#fff}
.radio-row label:has(input:checked){background:var(--brand);border-color:var(--brand);color:#fff}
.qgrp{font-weight:700;color:var(--brand-dark);font-size:12.5px;margin:14px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--border-light)}
.qgrp:first-child{margin-top:0}
.q.child{margin-left:22px;border-left:3px solid #fcc003}
.star{color:#dd7a01;font-size:12px}
.tent{font-size:10.5px;border-radius:10px;padding:0 6px;font-weight:400}
.tent.ph{background:#feded8;color:#8e030f}.tent.kari{background:#ecebea;color:#3e3e3c}
.cond{font-size:10.5px;color:var(--text-mute);font-weight:400}
.auto-val{background:#f3f3f3;border-radius:4px;padding:5px 8px;color:var(--text-weak)}
.file-drop{border:1px dashed #b0adab;border-radius:4px;padding:8px 10px;background:#fafaf9}
.warn{color:var(--red);font-size:12px;margin-top:4px}
.mtx input,.mtx select{width:100%;min-width:70px;border:1px solid var(--border);border-radius:3px;padding:3px 5px}
.mtx input:disabled{background:#f3f3f3}
.mtx tr.off td{color:var(--text-mute);background:#fafaf9}
.mtx td{padding:4px 5px}
.merged summary{cursor:pointer;color:var(--text-mute);font-size:12px}
.why-box{background:#f3f9ff;border-left:3px solid var(--brand);padding:8px 10px;margin-top:6px;font-size:12px;color:var(--text-weak)}
.progress{height:8px;background:#ecebea;border-radius:4px;overflow:hidden}
.progress>div{height:100%;background:var(--green)}

/* ---------- その他 ---------- */
.toast{position:fixed;top:100px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 20px;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:100;min-width:320px;max-width:90vw}
.toast.info{background:#444}
.modal-bg{position:fixed;inset:0;background:rgba(8,7,7,.55);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal{background:#fff;border-radius:4px;width:640px;max-width:100%;max-height:90vh;display:flex;flex-direction:column}
.modal-h{padding:14px 16px;border-bottom:1px solid var(--border);font-size:18px;text-align:center}
.modal-b{padding:16px;overflow:auto}
.modal-f{padding:10px 16px;border-top:1px solid var(--border);background:#f3f3f3;display:flex;justify-content:flex-end;gap:6px}
.flow-step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--border)}
.flow-step .n{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.notif-panel{position:fixed;right:12px;top:80px;width:min(360px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:80}
.notif-panel .it{padding:10px 12px;border-bottom:1px solid var(--border-light);font-size:12.5px}
.notif-panel .it.unread{background:#f3f9ff}
.notif-panel .it .tm{font-size:11px;color:var(--text-mute)}
.muted{color:var(--text-mute)}
.small{font-size:11.5px}
.right{text-align:right}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{background:#fffbe6;border:1px solid #f2cf5b;border-radius:4px;padding:8px 10px;font-size:12px;color:#5c4400}
.spec-tag{display:inline-block;font-size:10.5px;border:1px solid #b0adab;color:var(--text-mute);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:middle;font-weight:400}
.feed-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-light)}
.bar-chart .row{display:grid;grid-template-columns:200px 1fr 90px;align-items:center;gap:8px;margin:6px 0;font-size:12px}
.bar-chart .bars{position:relative;height:22px}
.bar-chart .b1,.bar-chart .b2{position:absolute;left:0;height:10px;border-radius:2px}
.bar-chart .b1{top:0;background:#90d0fe}
.bar-chart .b2{top:11px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-mute);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kb-article h3{font-size:14px;margin:12px 0 4px}
.kb-article p,.kb-article li{font-size:13px}
.kb-article ol{padding-left:20px}
.obj-map{display:grid;grid-template-columns:1fr 1.4fr 2.4fr;gap:12px}
.obj-map .grp{border:2px dashed #8ab8f0;border-radius:6px;padding:8px}
.obj-map .grp h4{color:var(--brand);font-size:13px;margin-bottom:6px}
.cyl{display:inline-block;border-radius:50%/12px;padding:10px 14px;margin:4px;border:1px solid #888;font-size:12px;text-align:center;min-width:90px;cursor:pointer}
.cyl.std{background:#cfe7fd}.cyl.cus{background:#dcebd7}
.cyl:hover{outline:2px solid var(--brand)}
a.cyl{color:var(--text);text-decoration:none}
.lv-sel{font-size:18px;font-weight:700;border:none;background:transparent;font-family:inherit;color:var(--text);cursor:pointer;padding:0 4px 0 0;max-width:100%}
.lv-sel:hover{background:#f3f3f3}
.click{cursor:pointer}.kpi.click:hover{border-color:var(--brand)}
.btn.on{background:var(--brand-light);color:var(--brand-dark);font-weight:700}
a.btn{display:inline-block;text-decoration:none}
a.avatar{text-decoration:none}
.i-todo{background:#3ba755}.i-event{background:#cb65ff}.i-user{background:#65cae4}.i-appr{background:#f38303}
.form1{display:flex;flex-direction:column;gap:10px}
.form1 label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--text-weak)}
.form1 input,.form1 select,.form1 textarea{border:1px solid var(--border);border-radius:4px;padding:6px 8px;font-size:13px;color:var(--text);background:#fff;width:100%}
.modal.wide{width:880px}
.launcher{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.launcher .lt{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:4px;padding:10px;color:var(--text)}
.launcher .lt:hover{border-color:var(--brand);text-decoration:none;background:#f3f9ff}
a.app-name{color:var(--text);cursor:pointer}a.app-name:hover{text-decoration:none;background:#f3f3f3}
a.tab{text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.qdoc{border:1px solid var(--border);padding:24px;background:#fff}

/* ---------- 集約ロジック（進捗・粗利・納期） ---------- */
/* @owner WP3 */
function pjCalc(p){
  const ks = DB.kousu.filter(k=>k.pj===p.id);
  const plan = ks.reduce((a,k)=>a+k.plan,0), act = ks.reduce((a,k)=>a+k.act,0);
  const laborForecast = Math.max(plan,act)*RATE;
  const costForecast = p.purchase + laborForecast + extraCost(p);
  const addRev = DB.requests.filter(r=>r.pj===p.id&&r.type==='追加請求'&&r.status==='承認済').reduce((a,r)=>a+r.lines.reduce((b,l)=>b+(l.ans||0)*l.q,0),0);
  const revenue = p.amount + addRev;
  const margin = (revenue-costForecast)/revenue*100;
  const days = daysTo(p.due);
  // 進捗：計画上の経過率 vs ステージ進捗率
  const total = (new Date(p.due)-new Date(p.start)), elapsed = (TODAY-new Date(p.start));
  const planPct = Math.min(100,Math.max(0,elapsed/total*100));
  const actPct = p.stage>=5?100:(p.stage/5)*100;
  const progLamp = actPct>=planPct-10?'g':actPct>=planPct-25?'y':'r';
  const marginLamp = margin>=MARGIN_TARGET?'g':margin>=MARGIN_TARGET-5?'y':'r';
  const dueLamp = p.stage>=5?'g':(days<0?'r':(days<30&&p.stage<4)?'r':days<45?'y':'g');
  const overHours = ks.filter(k=>k.act>k.plan).length;
  return {plan,act,costForecast,revenue,addRev,margin,days,planPct,actPct,progLamp,marginLamp,dueLamp,overHours};
}

function extraCost(p){ /* 承認済み追加請求の原価（明細の原価×数量）を見込原価に加算する */
  return DB.requests.filter(r=>r.pj===p.id&&r.type==='追加請求'&&r.status==='承認済').reduce((a,r)=>a+r.lines.reduce((b,l)=>b+(l.target||0)*l.q,0),0); }

/* @owner WP2 */
function gantt(p){
  const s=new Date(p.start), e=new Date(p.due); s.setDate(1); const span=e-s+86400000*10;
  const pos=d=>((new Date(d)-s)/span*100);
  const months=[]; const m=new Date(s); while(m<=e){months.push(new Date(m));m.setMonth(m.getMonth()+1);}
  const colors={kakou:'#e86e4a',kian:'#4a74e8',sekkei:'#d1446b',seizou:'#7a5af5',chou:'#06a59a'};
  return `<div class="gantt"><div class="g-head"><div></div><div class="g-months">${months.map(d=>`<span style="left:${pos(d)}%">${d.getMonth()+1}月</span>`).join('')}</div></div>
  ${SUBS.map(x=>{const d=p[x.k];const ks=['d1','d2','d3','d4'].filter(k=>d[k]);const a=d[ks[0]],b=d[ks[ks.length-1]];
    return `<div class="g-row"><div class="g-name">${x.label}</div><div class="g-track"><div class="g-bar" style="left:${pos(a)}%;width:${Math.max(1,pos(b)-pos(a))}%;background:${colors[x.k]}" title="${fmtD(a)}〜${fmtD(b)}"></div>
    ${TODAY>=s&&TODAY<=e?`<div class="g-today" style="left:${pos(TODAY)}%"></div>`:''}</div></div>`}).join('')}
  <div class="g-row"><div class="g-name"><b>納期</b></div><div class="g-track"><div class="g-bar" style="left:${pos(p.due)-0.5}%;width:1%;background:#000" title="${fmtD(p.due)}"></div></div></div></div>`;
}

/* @owner WP2 */
function setOppStage(id,i){
  const o=byId(DB.opps,id); if(o.stage>=OPP_WON){toast('受注済みの商談です','info');return;}
  const prob=OPP_PROB[i];
  if(o.stage!==i) wp2OppHist(o,'フェーズ',OPP_STAGES[o.stage],OPP_STAGES[i]);
  if(o.prob!==prob) wp2OppHist(o,'確度(%)',o.prob,prob);
  o.stage=i; o.prob=prob;
  if(i===OPP_WON){ runWonFlow(o); return; }
  toast(`フェーズを「${OPP_STAGES[i]}」に更新しました`); route();
}

function answered(q,a){
  const v=a[q.id];
  if(q.type==='auto') return true;
  if(q.type==='multi') return Array.isArray(v)&&v.length>0;
  if(q.type==='rows') return +a['A-043']>0 && (a.works||[]).slice(0,+a['A-043']).every(w=>w&&w.part);
  if(q.type==='quality') return (a.qm||[]).length>0 && a.qm.every(r=>r.st==='なし'||(r.st==='あり'&&r.target&&(a['A-108']!=='要求あり'||r.cpk)));
  return v!==undefined && v!==null && String(v).trim()!=='';
}

function layerProg(a,L){const qs=visibleQs(a).filter(q=>q.L===L&&q.req);return [qs.filter(q=>answered(q,a)).length,qs.length];}

/* @owner WP1 */
function hsComplete(id){
  const h=byId(DB.hearings,id); let D=0,T=0; const miss=[];
  if(h.status==='完了'){toast('このヒアリングシートは回答完了済みです','info');return;}
  LAYERS.forEach(x=>{const[d,t]=layerProg(h.ans,x.n);D+=d;T+=t;});
  if(D<T){
    const vis=visibleQs(h.ans);
    HS_GROUPS.forEach(g=>{const r=vis.filter(q=>q.g===g&&q.req&&!answered(q,h.ans)).length;if(r)miss.push(`L${hsGroupL(g)} ${g}（残${r}）`);});
    toast(`必須項目が未回答です：${miss.slice(0,6).join('、')}${miss.length>6?` ほか${miss.length-6}区分`:''}。抜け漏れ防止のため完了できません`,'info');return;}
  h.status='完了'; h.updated='2026-10-08'; const o=byId(DB.opps,h.opp);
  if(o&&o.stage<1) o.stage=1;
  notify(`ヒアリングシート「${h.name}」が完了しました（加工技術・設計：起案書・図面作成へ）。製造依頼書（プレビュー）はシート画面から確認できます`,'#/hearing/'+id,{depts:['技術部']});
  toast('ヒアリングシートを完了し、商談へ連携・技術部（加工技術・設計）へ通知しました'); route();
}

function editRec(kind,id){
  const d=EDIT[kind], r=byId(DB[d.arr],id);
  const inp=(f,i)=>{const [k,l,t]=f, v=r[k]??'';
    if(t.startsWith('user:')){const dep=t.slice(5);return `<select id="ef${i}">${DB.users.filter(u=>!dep||u.dept===dep||u.name===v).map(u=>`<option ${u.name===v?'selected':''}>${u.name}</option>`).join('')}${userBy(v)?'':`<option selected>${esc(v)}</option>`}</select>`;}
    if(t.startsWith('sel:')) return `<select id="ef${i}">${t.slice(4).split(',').map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
    if(t==='long') return `<textarea id="ef${i}" rows="3">${esc(v)}</textarea>`;
    return `<input id="ef${i}" type="${t==='num'?'number':t==='date'?'date':'text'}" value="${esc(v)}">`;};
  modal(d.title,`<div class="form1">${d.f.map((f,i)=>`<label>${f[1]}${inp(f,i)}</label>`).join('')}</div>`,()=>{
    const ch=[];
    d.f.forEach(([k,l,t],i)=>{let v=$('#ef'+i).value; if(t==='num') v=+v; if(String(r[k]??'')!==String(v)){ch.push(l);if(kind==='project')r.hist.unshift({dt:nowStr(),f:l,from:String(r[k]??''),to:String(v),by:meName()});const from=r[k];r[k]=v;emit('fieldChange',{kind,rec:r,field:k,label:l,from,to:v});}});
    toast(ch.length?`保存しました（${ch.join('、')}）`:'変更はありません',ch.length?'':'info');
  });
}

function pgProjects(mode){
  const isT = mode==='table';

  const hit = p => !q || [p.name,p.no,acc(p.acc).name].some(s=>String(s||'').toLowerCase().includes(q));
  const rows = lvApply('projects',PJ_VIEWS,DB.projects).filter(hit).sort((a,b)=>a.due.localeCompare(b.due));
  const head = `<div class="page-h"><div class="top"><span class="obj-icon i-project">📁</span><div><div class="obj-label">案件管理 ${stepBadge(2)}</div><h1>${lvSel('projects',PJ_VIEWS)}</h1></div>
    <div class="actions"><input id="pjQ" class="wp2-lsearch" type="search" placeholder="このリストを検索…" value="${esc(UI.pjQ||'')}" oninput="wp2PjSearch(this,event)" oncompositionend="wp2PjSearch(this,event)" title="案件名・取引先・案件番号で絞り込み"><div class="btn-group"><a class="btn ${isT?'':'on'}" href="#/projects">▥ カンバン</a><a class="btn ${isT?'on':''}" href="#/projects/table">☰ 一覧</a></div><button class="btn brand" onclick="pjNewInfo()">新規</button></div></div>

  const legend = `<div class="lamp-legend mt8">● ランプ：左から 進捗／粗利／納期 ／ <span class="pill r">⚑ 遅延</span> ${WP2_DELAY_NOTE} ／ <span class="pill y">原価UP n工程</span> ④原価予実で実績原価が予定原価を超えた工程の数（原価GAP）</div>`;
  if(isT) return head+`<div class="card"><div class="card-b tbl-wrap" style="padding-top:12px">${tbl(['案件番号','案件名','取引先','ステージ','技術担当','営業担当','納期','#受注額','#見込粗利率','状況','遅延フラグ','原価GAP'],
    rows.map(p=>{const c=pjCalc(p),f=EXT.fn.delayFlag(p),g=wp2Gap(p);return tr([p.no,pl(p.id),al(p.acc),STAGES[p.stage],ul(p.owner),ul(p.sales),fmtD(p.due),[man(c.revenue)],[`<span class="pill ${c.marginLamp}">${c.margin.toFixed(1)}%</span>`],lamps(c),
      `<span class="${f?'wp2-flag-on':'muted'}" title="${f?'遅延あり':'遅延なし'}">${f?'☑ 遅延':'☐'}</span>`,g.over?`<span class="pill y">原価UP ${g.over}工程</span>`:'']);}))}${legend}</div></div>`;
  return head+`<div class="card"><div class="card-b" style="padding-top:12px"><div class="kanban">
    ${STAGES.map((s,i)=>{const ps=rows.filter(p=>p.stage===i);
      return `<div class="k-col"><div class="k-col-h">${s}（${ps.length}）</div><div class="k-col-b" data-stage="${i}">
      ${ps.map(p=>{const c=pjCalc(p),f=EXT.fn.delayFlag(p),g=wp2Gap(p);return `<div class="k-card" draggable="true" data-id="${p.id}" onclick="go('#/project/${p.id}')">

        <div class="row"><span class="s">${man(c.revenue)}｜${esc(p.owner)}</span><span class="pill ${c.marginLamp}">粗利 ${c.margin.toFixed(1)}%</span></div>
        ${f||g.over?`<div class="row" style="justify-content:flex-start;gap:4px">${f?'<span class="pill r" title="遅延フラグ">⚑ 遅延</span>':''}${g.over?`<span class="pill y" title="原価GAP">原価UP ${g.over}工程</span>`:''}</div>`:''}</div>`}).join('')}

/* ---------- ① 入力内容選択（タイル）：区分＝定義書の DEF.g（全42区分）、L1〜L5 の見出しの下に定義書の順で並べる ---------- */
const HS_GROUPS = [...new Set(QS.map(q=>q.g))];
const hsGroupL = g => (QS.find(q=>q.g===g)||{L:1}).L;
const hsShort = g => String(g||'').replace(/^[^／]+／/,'');   // 「基本情報／」等の接頭辞は L の見出しと重複するので省く
/* 商談フェーズ（DB.opps.stage）→ 入力対象の最大レイヤー（仮置き：DECISIONS DC-02／CQ-01） */
const HS_DEPTH = {0:2,1:3,2:5,3:5};   // 引き合いL1〜L2／検討L1〜L3／正式・受注L1〜L5（10/14 4段階化に伴い読み替え）
UI.hsTiles = true; UI.hsGroup = null; UI.kbQ = {}; UI.mfgMiss = false;
function wp1MaxL(h){ const o=byId(DB.opps,h.opp); return o&&HS_DEPTH[o.stage]!=null?HS_DEPTH[o.stage]:5; }
/* 隣の区分（定義書の順、L をまたぐ）。回答により全項目が対象外の区分は飛ばす。なければ -1 */
function hsGroupStep(a,i,dir){ const vis=visibleQs(a); for(let j=i+dir;j>=0&&j<HS_GROUPS.length;j+=dir){ if(vis.some(q=>q.g===HS_GROUPS[j])) return j; } return -1; }
function wp1OpenGroup(i){
  const g=HS_GROUPS[i]; if(!g) return;
  UI.hsGroup=g; UI.hsLayer=hsGroupL(g); UI.hsFocus=null; route();
  const el=$('#hsForm'); if(el) window.scrollTo(0,Math.max(0,el.getBoundingClientRect().top+window.scrollY-8));
}
function wp1Depth(h){
  const o=byId(DB.opps,h.opp), maxL=wp1MaxL(h), a=h.ans;
  const miss=visibleQs(a).filter(q=>q.req&&q.L<=maxL&&!answered(q,a)).length;
  const rng=n=>n===1?'L1':'L1〜L'+n;
  const rows=[['引き合い',[0]],['検討',[1]],['正式・受注',[2,3]]];
  return `<div class="wp1-depth"><div class="flex">
      <span>商談フェーズ：<b>${o?esc(OPP_STAGES[o.stage]):'（商談の紐付けなし）'}</b> → 入力対象 <b>${rng(maxL)}</b></span>
      <span class="pill ${miss?'y':'g'}">現フェーズ範囲の必須未回答 ${miss} 件</span>
      <span class="tent kari">仮置き・要確認（CQ-01）</span></div>
    <details class="mt8"><summary class="small">商談フェーズと入力対象レイヤーの対応表（仮置き）</summary>
      <table class="wp1-mini mt8"><thead><tr><th>商談フェーズ</th><th>入力対象</th></tr></thead><tbody>
      ${rows.map(([n,st])=>`<tr class="${o&&st.includes(o.stage)?'on':''}"><td>${n}</td><td>${rng(HS_DEPTH[st[0]])}</td></tr>`).join('')}</tbody></table>
      <div class="small muted mt8">対応表は仮置きです（要確認：CQ-01）。「次フェーズ以降」の区分も入力できます（入力の制限はしていません）。</div></details></div>`;
}
function wp1Tile(h,g,cur,vis){
  const a=h.ans, v=vis.filter(q=>q.g===g), req=v.filter(q=>q.req), done=req.filter(q=>answered(q,a)).length, i=HS_GROUPS.indexOf(g);
  if(!v.length) return `<div class="wp1-tile off" title="回答内容により対象外の区分です"><div class="t">${esc(hsShort(g))}</div><div class="s">回答により対象外</div></div>`;
  const ok=req.length>0&&done===req.length;
  return `<button class="wp1-tile ${cur?'cur':'nx'} ${UI.hsGroup===g?'on':''} ${ok?'ok':''}" onclick="wp1OpenGroup(${i})">
    <div class="t">${esc(hsShort(g))}${ok?'<span class="ck" title="必須項目の回答済み">✓</span>':''}</div>
    <div class="s">${req.length?`必須 ${done}/${req.length}`:`任意 ${v.length}項目`}</div>
    <div class="ph ${cur?'cur':'nx'}">${cur?'現フェーズで入力':'次フェーズ以降'}</div></button>`;
}
function wp1Tiles(h){
  const a=h.ans, maxL=wp1MaxL(h), vis=visibleQs(a), open=UI.hsTiles!==false;
  const head=`<div class="card-h">入力内容選択<span class="small muted wp1-sub">区分を選ぶと、下の入力欄にその区分の項目だけを表示します</span><span class="right"><button class="btn" onclick="UI.hsTiles=${open?'false':'true'};route()">${open?'閉じる ▲':'開く ▼'}</button></span></div>`;

}

/* ---------- ⑤ 類似ナレッジ（ヒアリングシート内の検索パネル：REQ-5-04・5-05・5-07） ---------- */
const wp1KbPub = () => DB.knowledge.filter(k=>k.status!=='下書き');
/* 検索語の自動セット：機種の商品名の主要語・加工品名・海外なら国名（キーワード一致のみ。AI推薦はしない） */
function wp1KbTerms(h){
  const a=h.ans, t=[], m=byId(DB.products,a['A-008']);
  if(m){ const w=m.name.replace(/（.*?）/g,'').replace(/^(縦型|横型|半自動|手動)/,'').trim(); if(!/^ホーニング盤?$/.test(w)) t.push(w); }   // 一般語「ホーニング盤」は全機種に共通で絞り込みにならないため除く
  if(a['A-013']) t.push(String(a['A-013']).replace(/（.*?）/g,'').trim());
  if(isOverseas(a)) t.push(a['A-003']);
  return [...new Set(t.filter(Boolean))].slice(0,3).join(' ');
}
function wp1KbHits(q){
  const ws=String(q||'').split(/[\s　]+/).filter(Boolean).map(w=>w.toLowerCase());
  const all=wp1KbPub();
  if(!ws.length) return [...all].sort((x,y)=>String(y.updated).localeCompare(String(x.updated)));
  return all.map(k=>{const s=(k.title+' '+Object.values(k.body).join(' ')).toLowerCase();return {k,n:ws.filter(w=>s.includes(w)).length};})
    .filter(x=>x.n>0).sort((x,y)=>y.n-x.n||String(y.k.updated).localeCompare(String(x.k.updated))).map(x=>x.k);
}
function wp1KbRow(k){
  const first=String(Object.values(k.body)[0]||''); const sum=first.length>40?first.slice(0,40)+'…':first;
  return `<div class="wp1-kbrow"><div class="wp1-kbt"><a onclick="EXT.fn.kbPreview('${k.id}')">${esc(k.title)}</a><button class="btn wp1-eye" title="プレビュー" aria-label="プレビュー" onclick="EXT.fn.kbPreview('${k.id}')">👁</button></div>
    <div class="small muted">${esc(sum)}</div><div class="small muted">最終公開日：${fmtD(k.updated)}</div></div>`;
}
function wp1KbRes(h){
  const hits=wp1KbHits(UI.kbQ[h.id]);
  let rel='';
  if(UI.hsGroup){
    const ids=QS.filter(q=>q.g===UI.hsGroup).map(q=>q.id);
    const r=wp1KbPub().filter(k=>(KB_ITEMS[k.id]||[]).some(x=>ids.includes(x)));
    if(r.length) rel=`<div class="wp1-kbrel"><div class="small"><b>この区分に関連</b>（${esc(hsShort(UI.hsGroup))}）</div>${r.map(wp1KbRow).join('')}<div class="small muted mt8">記事と項目の関連づけは仮置きです（要確認：CQ-15）</div></div>`;
  }
  return rel+`<div class="small mt8"><b>${hits.length}件の記事が見つかりました</b></div>`+hits.map(wp1KbRow).join('');
}
function wp1KbPanel(h){
  if(UI.kbQ[h.id]===undefined) UI.kbQ[h.id]=wp1KbTerms(h);
  return `<div class="card wp1-kb" id="wp1Kb"><div class="card-h">📖 類似ナレッジ</div><div class="card-b">
    <div class="wp1-kbs"><input id="wp1KbQ" value="${esc(UI.kbQ[h.id])}" placeholder="ナレッジを検索" aria-label="ナレッジを検索" onkeydown="if(event.key==='Enter'&&!event.isComposing)wp1KbSearch('${h.id}')"><button class="btn" title="検索" aria-label="検索" onclick="wp1KbSearch('${h.id}')">🔍</button></div>
    <div class="small muted mt8">初期の検索語は入力内容（機種・加工品名・納入先国）から自動でセットしています（キーワード一致）。</div>
    <div id="wp1KbRes">${wp1KbRes(h)}</div></div></div>`;
}
/* 再描画（route）せず結果だけ更新する。検索語は UI.kbQ に保持するので、再描画しても残る */
function wp1KbSearch(hid){ const i=$('#wp1KbQ'); if(i) UI.kbQ[hid]=i.value; const r=$('#wp1KbRes'); if(r) r.innerHTML=wp1KbRes(byId(DB.hearings,hid)); }

/* ---------- ⑤ 記事のモーダル表示（REQ-5-06・5-08）。「完了」は閉じるだけ（route を呼ばないので入力・表示中の区分はそのまま） ---------- */
EXT.fn.kbPreview = id => {
  const k=byId(DB.knowledge,id); if(!k){ toast('記事が見つかりません','info'); return; }
  k.views=(k.views||0)+1;
  modal(esc(k.title),`<div class="flex mb8"><span class="pill b">${esc(k.cat)}</span><span class="small muted">最終公開日：${fmtD(k.updated)}　閲覧数：${k.views}</span></div>
    <div class="kb-article">${Object.entries(k.body).map(([t,v])=>`<h3>${esc(t)}</h3><p>${esc(v)}</p>`).join('')}</div>`,null,null,true);
  const f=$('#overlay .modal-f');
  if(f) f.innerHTML=`<a class="wp1-kbopen" href="#/kb/${k.id}" onclick="closeModal()">記事を開く</a><button class="btn brand" onclick="closeModal()">完了</button>`;
};

function wp2Bigrams(s){ const t=String(s||'').replace(/[^一-鿿゠-ヿA-Za-z0-9]+/g,' '), r=new Set(); t.split(' ').forEach(w=>{ for(let i=0;i+1<w.length;i++){ const g=w.slice(i,i+2); if(!WP2_KB_STOP.has(g)) r.add(g); } }); return r; }
function wp2SimKb(c){

  return DB.knowledge.map(k=>{ const b=wp2Bigrams(k.title+' '+((k.body||{}).現象||'')); let n=0; b.forEach(x=>{ if(q.has(x)) n++; });
      return {k,n,s:(k.id===c.kb?1000:0)+n*2+(n>=2&&k.cat===cat?3:0)}; })
    .filter(x=>x.k.id===c.kb||x.n>=2).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.k);
}

const wp2Av = (uid,sm) => { const u=wp2U(uid); return `<span class="fd-av ${sm?'sm':''}" style="background:${WP2_DEPT_COLOR[u.dept]||'#b0adab'}" title="${esc(wp2ULabel(uid))}">${esc(u.name.slice(0,1))}</span>`; };

const wp2Men = t => t.t==='user'?`<a class="fd-men" href="#/user/${t.id}">@${esc(wp2ULabel(t.id))}</a> さん`:`<span class="fd-men">@${esc(t.id)}グループ</span>`;

function wp2FdLikes(likes){ return likes&&likes.length?`<div class="fd-likes">👍 ${likes.map(id=>esc(wp2U(id).name)+'さん').join('、')}がいいね!と言っています</div>`:''; }
function wp2FdFiles(files){ return files&&files.length?`<div class="fd-files">${files.map(f=>`<a class="fd-file click" data-n="${esc(f)}" onclick="wp2FdDl(this)" title="ダウンロード（デモ用のダミー）">📎 ${esc(f)}</a>`).join('')}</div>`:''; }

function wp2MenOpts(){
  return `<option value="">@メンション…</option><optgroup label="ユーザー">${DB.users.map(u=>`<option value="user:${u.id}">${esc(u.name)}（${esc(u.dept)}）</option>`).join('')}</optgroup>
    <optgroup label="グループ（部門の単位は仮置き・要確認 CQ-05）">${WP2_GROUPS.map(g=>`<option value="dept:${g}">${g}グループ</option>`).join('')}</optgroup>`;
}
const wp2Chip = (t,rm) => `<span class="fd-chip">${t.t==='user'?'@'+esc(wp2ULabel(t.id)):'@'+esc(t.id)+'グループ'}<button title="取り消す" onclick="${rm}">✕</button></span>`;
const wp2LastAct = f => [f.at,...(f.comments||[]).map(c=>c.at)].sort().pop();
EXT.fn.feed = (kind,id) => {
  const key=wp2FdKey(kind,id), sort=UI.fdSort[key]||'recent', d=UI.fd[key]||{text:'',to:[],files:[]}, me=myUser().id;
  const list=DB.feeds.filter(f=>f.kind===kind&&f.rid===id).sort((a,b)=>sort==='recent'?wp2LastAct(b).localeCompare(wp2LastAct(a)):b.at.localeCompare(a.at));
  const post=f=>`<div class="fd-post" id="fdp-${f.id}">
    <div class="fd-head">${wp2Av(f.by)}<div><a class="fd-name" href="#/user/${f.by}">${esc(wp2U(f.by).name)}</a><span class="muted">（${esc(wp2U(f.by).dept)}）</span>
      <div class="small muted">${f.at}${f.edited?` ・ ${f.edited} に編集されました`:''}</div></div></div>

    <div class="fd-acts"><button class="fd-act ${f.likes.includes(me)?'on':''}" onclick="wp2FdLike('${kind}','${id}','${f.id}')" title="${f.likes.includes(me)?'もう一度押すと取り消します':''}">👍 いいね!</button><button class="fd-act" onclick="wp2FdCmtOpen('${kind}','${id}','${f.id}')">💬 コメント${f.comments.length?`（${f.comments.length}）`:''}</button></div>
    ${wp2FdLikes(f.likes)}
    <div class="fd-cmts">${f.comments.map((c,i)=>`<div class="fd-cmt"><div class="fd-head">${wp2Av(c.by,1)}<div><a class="fd-name" href="#/user/${c.by}">${esc(wp2U(c.by).name)}</a><span class="muted">（${esc(wp2U(c.by).dept)}）</span><div class="small muted">${c.at}</div></div></div>
      ${wp2FdBody(c)}<div class="fd-acts"><button class="fd-act ${(c.likes||[]).includes(me)?'on':''}" onclick="wp2FdLike('${kind}','${id}','${f.id}',${i})">👍 いいね!</button></div>${wp2FdLikes(c.likes)}</div>`).join('')}${UI.fdOpen.has(f.id)?wp2CmtComp(kind,id,f.id):''}</div>

  return `<div class="card fd-card ${kind==='project'?'flat':''}" id="fd-${key}"><div class="card-h"><span class="obj-icon sm i-opp" style="background:#1b96ff">💬</span>フィード (${list.length})
    <span class="right"><select aria-label="並び替え" onchange="UI.fdSort['${key}']=this.value;wp2FdRefresh('${kind}','${id}')"><option value="recent" ${sort==='recent'?'selected':''}>並び替え：最近の活動</option><option value="posted" ${sort==='posted'?'selected':''}>並び替え：投稿日順</option></select></span></div>
    <div class="card-b"><div class="fd-comp">
      <div class="fd-chips">${d.to.map((t,i)=>wp2Chip(t,`wp2FdRm('${kind}','${id}','to',${i})`)).join('')}${d.files.map((f,i)=>`<span class="fd-chip file">📎 ${esc(f)}<button title="取り消す" onclick="wp2FdRm('${kind}','${id}','files',${i})">✕</button></span>`).join('')}</div>
      <textarea id="fdt-${key}" rows="2" placeholder="質問・相談を投稿します。@メンションで関係者や部門に通知できます" oninput="wp2FdDraft('${kind}','${id}').text=this.value">${esc(d.text)}</textarea>

        <button class="btn brand" onclick="wp2FdPost('${kind}','${id}')">投稿</button></div>

    ${list.map(post).join('')||'<div class="muted small">まだ投稿はありません。最初の投稿をしてみましょう。</div>'}</div></div>`;

function wp2CmtComp(kind,id,fid){
  const d=UI.fdc[fid]||{text:'',to:[]};
  return `<div class="fd-cmt"><div class="fd-comp"><div class="fd-chips">${d.to.map((t,i)=>wp2Chip(t,`wp2FdCmtRm('${kind}','${id}','${fid}',${i})`)).join('')}</div>
    <textarea id="fdc-${fid}" rows="2" placeholder="コメントを書く…" oninput="(UI.fdc['${fid}']=UI.fdc['${fid}']||{text:'',to:[]}).text=this.value">${esc(d.text)}</textarea>
    <div class="fd-tools"><select aria-label="@メンション" onchange="wp2FdCmtAddTo('${kind}','${id}','${fid}',this.value)">${wp2MenOpts()}</select><button class="btn brand" onclick="wp2FdComment('${kind}','${id}','${fid}')">コメント</button></div></div></div>`;
}
function wp2FdDraft(kind,id){ const k=wp2FdKey(kind,id); return UI.fd[k]||(UI.fd[k]={text:'',to:[],files:[]}); }
function wp2FdRefresh(kind,id){ const el=document.getElementById('fd-'+wp2FdKey(kind,id)); if(el) el.outerHTML=EXT.fn.feed(kind,id); else route(); }
function wp2ParseTo(v){ const [t,...r]=String(v).split(':'); const id=r.join(':'); return (t==='user'||t==='dept')&&id?{t,id}:null; }
function wp2FdAddTo(kind,id,v){ const t=wp2ParseTo(v); if(!t) return; const d=wp2FdDraft(kind,id); if(!d.to.some(x=>x.t===t.t&&x.id===t.id)) d.to.push(t); wp2FdRefresh(kind,id); }
function wp2FdAddFile(kind,id,v){ if(!v) return; const d=wp2FdDraft(kind,id); if(!d.files.includes(v)) d.files.push(v); wp2FdRefresh(kind,id); }
function wp2FdRm(kind,id,f,i){ wp2FdDraft(kind,id)[f].splice(i,1); wp2FdRefresh(kind,id); }
function wp2FdCmtOpen(kind,id,fid){ UI.fdOpen.has(fid)?UI.fdOpen.delete(fid):UI.fdOpen.add(fid); wp2FdRefresh(kind,id); const t=document.getElementById('fdc-'+fid); if(t) t.focus(); }
function wp2FdCmtAddTo(kind,id,fid,v){ const t=wp2ParseTo(v); if(!t) return; const d=UI.fdc[fid]||(UI.fdc[fid]={text:'',to:[]}); if(!d.to.some(x=>x.t===t.t&&x.id===t.id)) d.to.push(t); wp2FdRefresh(kind,id); }
function wp2FdCmtRm(kind,id,fid,i){ (UI.fdc[fid]||{to:[]}).to.splice(i,1); wp2FdRefresh(kind,id); }
function wp2FdLike(kind,id,fid,ci){
  const f=byId(DB.feeds,fid); if(!f) return; const x=ci==null?f:f.comments[ci]; x.likes=x.likes||[]; const me=myUser().id;
  const i=x.likes.indexOf(me); i>=0?x.likes.splice(i,1):x.likes.push(me); wp2FdRefresh(kind,id);
}
/* メンション・フォローの通知（ユーザー宛て／部門グループ宛て） */
/* 部門宛ての宛先から特定ユーザーを除く：除外ユーザーを含む部署は、その部署の他のメンバー個別宛てに展開する（③ tkTo と同じ方式） */
function wp2ToExcl(depts,excl){
  const ex=new Set(excl.filter(Boolean)), users=[], ds=[];
  [...new Set(depts.filter(Boolean))].forEach(d=>{ const mem=DB.users.filter(u=>u.dept===d);
    if(mem.some(u=>ex.has(u.id))) users.push(...mem.filter(u=>!ex.has(u.id)).map(u=>u.id)); else ds.push(d); });
  return {users:[...new Set(users)],depts:ds};
}
function wp2FdNotify(kind,id,by,to,text,thread){
  const rec=wp2FdRecLabel(kind,id), link='#/'+kind+'/'+id, bu=wp2U(by), s=text.replace(/\s+/g,' '), head=s.length>30?s.slice(0,30)+'…':s, sent=new Set(); let n=0;
  to.filter(t=>t.t==='user').forEach(t=>{ if(t.id===by||sent.has(t.id)) return;
    notify(`${bu.name}さんが${rec}であなた（${wp2U(t.id).dept}）をメンションしました：${head}`,link,{users:[t.id]}); sent.add(t.id); n++; });
  to.filter(t=>t.t==='dept').forEach(t=>{
    const dest=wp2ToExcl([t.id],[by,...sent]); if(!dest.users.length&&!dest.depts.length) return;   /* 個別にメンション済みの人・投稿者本人には重ねて送らない */
    notify(`${bu.name}さんが${rec}で${t.id}グループ（あなたの部署）をメンションしました：${head}`,link,dest); n++;
    DB.users.filter(u=>u.dept===t.id).forEach(u=>sent.add(u.id)); });
  const fl=followersOf(kind+':'+id).filter(u=>u!==by&&!sent.has(u));
  if(fl.length){ notify(`フォロー中の${rec}に新しい${thread?'コメント':'投稿'}があります（${bu.name}さん）：${head}`,link,{users:fl}); fl.forEach(u=>sent.add(u)); n++; }
  if(thread&&thread!==by&&!sent.has(thread)){ notify(`${bu.name}さんがあなたの投稿にコメントしました（${rec}）：${head}`,link,{users:[thread]}); n++; }
  return n;
}
function wp2FdPost(kind,id){
  const d=wp2FdDraft(kind,id), ta=document.getElementById('fdt-'+wp2FdKey(kind,id)); if(ta) d.text=ta.value;
  const text=d.text.trim(); if(!text){ toast('本文を入力してください','info'); return; }
  const me=myUser().id, n=DB.feeds.reduce((a,f)=>Math.max(a,+f.id.slice(2)||0),0)+1;
  DB.feeds.unshift({id:'FD'+String(n).padStart(2,'0'),kind,rid:id,by:me,at:nowStr(),body:text,to:[...d.to],files:[...d.files],likes:[],comments:[]});
  const sent=wp2FdNotify(kind,id,me,d.to,text,null);
  UI.fd[wp2FdKey(kind,id)]={text:'',to:[],files:[]};
  wp2FdRefresh(kind,id);
  toast(sent?'投稿しました。メンション先・フォロー中のユーザーへ通知しました':'投稿しました');
}
function wp2FdComment(kind,id,fid){
  const f=byId(DB.feeds,fid); if(!f) return; const d=UI.fdc[fid]||{text:'',to:[]}, ta=document.getElementById('fdc-'+fid); if(ta) d.text=ta.value;
  const text=(d.text||'').trim(); if(!text){ toast('コメントを入力してください','info'); return; }
  const me=myUser().id; f.comments.push({by:me,at:nowStr(),body:text,to:[...d.to],likes:[]});
  const sent=wp2FdNotify(kind,id,me,d.to,text,f.by);
  delete UI.fdc[fid]; UI.fdOpen.delete(fid); wp2FdRefresh(kind,id);
  toast(sent?'コメントしました。関係者へ通知しました':'コメントしました');
}

/* ---------- ④ 工程別の原価予実（DC-12） ---------- */
function procCost(p){
  return SUBS.map(s=>{
    const ks=DB.kousu.filter(k=>k.pj===p.id&&k.sub===s.k);
    const ph=ks.reduce((a,k)=>a+k.plan,0), ah=ks.reduce((a,k)=>a+k.act,0);
    const pp=s.k==='chou'?(p.purchase||0):0, pa=s.k==='chou'?(p.purchaseAct||0):0;
    const plan=ph*RATE+pp, act=ah*RATE+pa;
    return {s,sub:s.k,ph,ah,pp,pa,plan,act,diff:act-plan,over:act>plan};
  });
}
function tkGapTxt(g){ return g.items.map(x=>`${SUBS.find(s=>s.k===x.sub).label}（+${yen(x.act-x.plan)}）`).join('、'); }
function tkCostSt(x){ return !x.plan&&!x.act?'<span class="small muted">未計上</span>':x.over?'<span class="pill r">原価UP</span>':'<span class="pill g">予定内</span>'; }
const TK_COST_NOTE = `工数単価（${yen(RATE)}/h）・判定条件（実績原価＞予定原価、閾値0%）は仮置きです（要確認：CQ-10・CQ-11）。基幹実績との Tableau 連携は予定です（ステップ2）。本画面は Salesforce 内の工数・仕入から算出しています。`;

  const g=EXT.fn.costGap(p), nw=g.items.filter(x=>!before.includes(x.sub)); if(!nw.length) return '';

}

function tkPgReport(){
  const f=UI.trDept||'すべて', T=DB.requests.filter(isTicket);
  const agg=list=>TK_PH.map(ph=>{const v=list.map(r=>tkStays(r)[ph]).filter(x=>x!=null);return {avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null,med:tkMed(v),n:v.length};});
  const lines=[];
  TK_DEPTS.filter(d=>f==='すべて'||d===f).forEach(d=>{const ds=T.filter(r=>r.to===d); if(!ds.length) return;
    TK_CATS.filter(c=>ds.some(r=>tkCat(r)===c)).forEach((c,i)=>lines.push({k:'cat',d:i?'':d,c,a:agg(ds.filter(r=>tkCat(r)===c))}));
    lines.push({k:'sub',d:'',c:d+' 小計',a:agg(ds)});});
  if(f==='すべて') lines.push({k:'sub',d:'',c:'総計',a:agg(T)});
  const cats=lines.filter(l=>l.k==='cat'), mx=TK_PH.map((_,j)=>({avg:Math.max(0,...cats.map(l=>l.a[j].avg||0)),med:Math.max(0,...cats.map(l=>l.a[j].med||0))}));
  const cell=(l,j,k)=>{const v=l.a[j][k];return `<td class="num ${j>0&&l.k==='cat'&&v>0&&v===mx[j][k]?'tk-max':''}">${v==null?'—':v.toFixed(1)}</td>`;};
  return `<div class="page-h"><div class="top"><span class="obj-icon i-report">📊</span><div><div class="obj-label"><a href="#/requests">依頼（チケット）</a>｜レポート</div><h1>部門・依頼区分・ステータスごとのチケット処理時間（平均値・中央値）</h1></div>
    <div class="actions"><label class="small muted">依頼先部門 <select class="tk-sel" onchange="UI.trDept=this.value;route()">${['すべて',...TK_DEPTS].map(d=>`<option ${d===f?'selected':''}>${d}</option>`).join('')}</select></label></div></div>
    <div class="small mt8">依頼先部門で自部門に絞り込んでご利用ください。</div>
    <div class="small muted">対象：追加要求・部門対応依頼・原価見積依頼（追加請求は承認の管理のため対象外）。単位：時間（h）。対応中・受付待ちのチケットは現在までの経過時間で集計しています。依頼区分は仮置きです（要確認：CQ-08）。</div></div>
  <div class="card"><div class="card-h">チケット処理時間<span class="right legend"><span><i style="background:#feded8;border:1px solid #f4b6ae"></i>「受付待ち」「対応中」の各列で最大の値（ボトルネック）</span></span></div>
  <div class="card-b tbl-wrap"><table class="tbl tk-rep"><thead>
    <tr><th rowspan="2">依頼先部門</th><th rowspan="2">依頼区分</th>${TK_PH.map(s=>`<th colspan="3" class="tk-ph">${s}</th>`).join('')}</tr>
    <tr>${TK_PH.map(()=>'<th class="num">平均(h)</th><th class="num">中央値(h)</th><th class="num">件数</th>').join('')}</tr></thead><tbody>
    ${lines.map(l=>`<tr class="${l.k==='sub'?'tk-subtot':''}"><td>${l.d?`<b>${l.d}</b>`:''}</td><td>${l.c}</td>${TK_PH.map((_,j)=>cell(l,j,'avg')+cell(l,j,'med')+`<td class="num">${l.a[j].n}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="11" class="muted">該当するチケットはありません</td></tr>'}
  </tbody></table></div></div>`;
}

function wpbTestNotify(o,h,why){

}
{ const _set=setOppStage; setOppStage=function(id,i){ const o=byId(DB.opps,id), prev=o?o.stage:null; _set(id,i);
  if(!o||prev===1||o.stage!==1) return; const h=DB.hearings.find(x=>x.opp===id);
  if(h&&h.ans['A-316']==='テスト予定'){ wpbTestNotify(o,h,'フェーズ変更'); toast('フェーズを「検討」に更新しました。テスト加工「あり」のため、技術部（加工技術・設計）へ自動通知しました'); } }; }
{ const _hs=hsSet; hsSet=function(hid,k,v){ const h=byId(DB.hearings,hid), prev=h&&h.ans['A-316']; _hs(hid,k,v);
  if(!h||prev==='テスト予定'||h.ans['A-316']!=='テスト予定') return; const o=byId(DB.opps,h.opp);
  if(o&&o.stage===1){ wpbTestNotify(o,h,'ヒアリングシート更新'); toast('テスト加工「あり」（テスト予定）のため、技術部（加工技術・設計）へ自動通知しました'); } }; }
