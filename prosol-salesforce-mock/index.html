<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日進ProSOL 案件管理モック</title>
<style>
/* =========================================================
   株式会社日進ProSOL様 Salesforce構築プロジェクト
   画面モック（Lightning Experience 風 / 単一HTML・外部依存なし）
   作成：thomas株式会社
   ※表示データはすべて架空のデモデータです
   ========================================================= */
:root{
  --brand:#0176d3; --brand-dark:#014486; --brand-light:#d8edff;
  --bg:#f3f3f3; --card:#fff; --border:#dddbda; --border-light:#e5e5e5;
  --text:#181818; --text-weak:#3e3e3c; --text-mute:#706e6b;
  --green:#2e844a; --green-bg:#cdefc4; --yellow:#dd7a01; --yellow-bg:#fef1cd;
  --red:#ba0517; --red-bg:#feded8; --purple:#5a1ba9;
  --path-done:#3ba755; --path-cur:#014486;
  --custom:#3c9662; --std:#1b96ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Salesforce Sans","Hiragino Kaku Gothic ProN","Hiragino Sans","Meiryo",-apple-system,"Segoe UI",sans-serif;
  font-size:13px;color:var(--text);background:var(--bg);line-height:1.5}
a{color:var(--brand);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:13px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}

/* ---------- デモバナー ---------- */
.demo-banner{background:#032d60;color:#fff;font-size:12px;padding:4px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.demo-banner b{color:#90d0fe}

/* ---------- グローバルヘッダー ---------- */
.g-header{background:#fff;height:50px;display:flex;align-items:center;padding:0 12px;gap:12px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--brand-dark);white-space:nowrap}
.logo .mark{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,#0176d3,#3ba755);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.g-search{flex:1;max-width:560px;margin:0 auto;position:relative}
.g-search input{width:100%;border:1px solid var(--border);border-radius:4px;padding:6px 10px 6px 30px;background:#fff}
.g-search::before{content:"🔍";position:absolute;left:9px;top:6px;font-size:12px;opacity:.6}
.g-tools{display:flex;align-items:center;gap:10px}
.icon-btn{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center}
.badge-count{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;line-height:16px}
.role-select{border:1px solid var(--border);border-radius:4px;padding:5px 8px;background:#fff}
.avatar{width:32px;height:32px;border-radius:50%;background:#b0adab;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}

/* ---------- アプリナビ ---------- */
.app-nav{background:#fff;border-bottom:3px solid var(--brand);display:flex;align-items:stretch;height:40px;padding-left:12px;box-shadow:0 2px 2px rgba(0,0,0,.06);overflow-x:auto}
.app-name{display:flex;align-items:center;gap:8px;padding-right:18px;margin-right:6px;font-size:16px;white-space:nowrap}
.app-name .grid{font-size:16px;color:var(--text-mute)}
.nav-item{display:flex;align-items:center;padding:0 12px;color:var(--text);border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap}
.nav-item:hover{background:#f3f3f3;text-decoration:none}
.nav-item.active{border-bottom-color:var(--brand-dark);font-weight:700;background:#f3f9ff}

/* ---------- レイアウト ---------- */
main{padding:12px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:4px;box-shadow:0 2px 2px rgba(0,0,0,.05);margin-bottom:12px}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;font-size:14px}
.card-h .right{margin-left:auto;display:flex;gap:6px;font-weight:400}
.card-b{padding:0 12px 12px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1000px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
@media(max-width:700px){main{padding:12px 16px}.g-search,.g-tools label{display:none}.logo span{display:none}.g-tools{margin-left:auto}.tbl{min-width:640px}.bar-chart .row{grid-template-columns:110px 1fr 56px!important}.fields{grid-template-columns:1fr}.notif-panel{right:8px;width:calc(100vw - 16px)}.app-name{font-size:14px}.page-h h1{font-size:16px}}

.obj-icon{width:28px;height:28px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0}
.obj-icon.sm{width:22px;height:22px;font-size:12px}
.i-project{background:#3c9662}.i-opp{background:#ff5d2d}.i-acc{background:#5867e8}.i-contact{background:#a094ed}
.i-hear{background:#0b827c}.i-req{background:#e3066a}.i-case{background:#f2cf5b;color:#333}.i-know{background:#ec94ed}
.i-kakou{background:#e86e4a}.i-kian{background:#4a74e8}.i-sekkei{background:#d1446b}.i-seizou{background:#7a5af5}.i-chou{background:#06a59a}
.i-kousu{background:#747474}.i-report{background:#2e844a}.i-prod{background:#b781d3}.i-quote{background:#88c651}

/* ---------- ボタン ---------- */
.btn{border:1px solid var(--border);background:#fff;color:var(--brand);border-radius:4px;padding:4px 12px;line-height:22px;white-space:nowrap}
.btn:hover{background:#f3f3f3}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.brand:hover{background:var(--brand-dark)}
.btn.success{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red)}
.btn-group{display:inline-flex}
.btn-group .btn{border-radius:0;margin-left:-1px}
.btn-group .btn:first-child{border-radius:4px 0 0 4px;margin-left:0}
.btn-group .btn:last-child{border-radius:0 4px 4px 0}

/* ---------- ページヘッダー ---------- */
.page-h{background:#fff;border:1px solid var(--border);border-radius:4px;padding:12px;margin-bottom:12px;box-shadow:0 2px 2px rgba(0,0,0,.05)}
.page-h .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-h .obj-label{font-size:12px;color:var(--text-weak)}
.page-h h1{font-size:18px;font-weight:700;line-height:1.3}
.page-h .actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.highlights{display:flex;gap:28px;margin-top:12px;flex-wrap:wrap}
.highlights .f .l{font-size:12px;color:var(--text-mute)}
.highlights .f .v{font-size:13px}

/* ---------- パス ---------- */
.path{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:4px;padding:10px 12px;margin-bottom:12px}
.path ol{display:flex;flex:1;list-style:none;min-width:0}
.path li{flex:1;position:relative;height:32px;margin-right:6px;background:#ecebea;color:var(--text);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%);white-space:nowrap;overflow:hidden;padding:0 14px}
.path li:first-child{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);border-radius:16px 0 0 16px}
.path li:last-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,10px 50%);border-radius:0 16px 16px 0;margin-right:0}
.path li.done{background:var(--path-done);color:#fff}
.path li.cur{background:var(--path-cur);color:#fff;font-weight:700}
.path li.sel{outline:none;box-shadow:inset 0 0 0 2px #000}
.path li:hover:not(.cur){filter:brightness(.95)}

/* ---------- タブ ---------- */
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 12px;overflow-x:auto}
.tab{padding:10px 14px;color:var(--text-weak);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--brand)}
.tab.active{color:var(--text);border-bottom-color:var(--brand);font-weight:700}
.tab-body{padding:12px}

/* ---------- テーブル ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:#fafaf9;color:var(--text-weak);font-weight:700;text-align:left;padding:6px 8px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--border-light);vertical-align:middle}
.tbl tr:hover td{background:#f3f9ff}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;background:#fafaf9}

/* ---------- 項目（詳細） ---------- */
.fields{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
.field{border-bottom:1px solid var(--border-light);padding:6px 2px}
.field .l{font-size:12px;color:var(--text-mute)}
.field .v{min-height:20px}
.section-title{background:#f3f3f3;border-radius:4px;padding:4px 10px;font-weight:700;margin:12px 0 6px;font-size:13px}

/* ---------- ピル・ランプ ---------- */
.pill{display:inline-block;border-radius:12px;padding:0 8px;font-size:11.5px;line-height:20px;background:#ecebea;white-space:nowrap}
.pill.g{background:var(--green-bg);color:#194e31}.pill.y{background:var(--yellow-bg);color:#8c4b02}.pill.r{background:var(--red-bg);color:#8e030f}
.pill.b{background:var(--brand-light);color:var(--brand-dark)}
.lamps{display:inline-flex;gap:3px;vertical-align:middle}
.lamp{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.lamp.g{background:#45c65a}.lamp.y{background:#fcc003}.lamp.r{background:#ea001e}
.lamp-legend{font-size:11.5px;color:var(--text-mute)}

/* ---------- カンバン ---------- */
.kanban{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.k-col{min-width:220px;flex:1;background:#f3f3f3;border-radius:4px}
.k-col-h{background:var(--brand-dark);color:#fff;font-weight:700;text-align:center;padding:6px;font-size:12.5px;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%)}
.k-col:first-child .k-col-h{clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%);border-radius:14px 0 0 14px}
.k-col-b{padding:6px;min-height:120px}
.k-col-b.drag-over{background:#d8edff}
.k-card{background:#fff;border:1px solid var(--border);border-radius:4px;padding:8px;margin-bottom:6px;cursor:grab;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.k-card:hover{border-color:var(--brand)}
.k-card .t{font-size:12.5px;color:var(--brand);font-weight:700;margin-bottom:2px}
.k-card .s{font-size:11.5px;color:var(--text-mute)}
.k-card .row{display:flex;justify-content:space-between;align-items:center;margin-top:4px}

/* ---------- KPI ---------- */
.kpi{padding:12px}
.kpi .l{color:var(--text-mute);font-size:12px}
.kpi .v{font-size:26px;font-weight:300;line-height:1.3}
.kpi .s{font-size:11.5px;color:var(--text-mute)}

/* ---------- ガント ---------- */
.gantt{position:relative;font-size:11.5px}
.g-row{display:grid;grid-template-columns:160px 1fr;align-items:center;border-bottom:1px solid var(--border-light);min-height:28px}
.g-row .g-name{padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-track{position:relative;height:28px}
.g-bar{position:absolute;top:7px;height:14px;border-radius:3px;opacity:.9}
.g-bar.plan{background:#c9c7c5}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:2}
.g-head{display:grid;grid-template-columns:160px 1fr;font-weight:700;color:var(--text-mute)}
.g-months{position:relative;height:22px}
.g-months span{position:absolute;top:2px;border-left:1px solid var(--border);padding-left:4px}

/* ---------- ヒアリングシート ---------- */
.hs-layout{display:grid;grid-template-columns:240px 1fr 300px;gap:12px}
@media(max-width:1100px){.hs-layout{grid-template-columns:1fr}}
.layer-nav{list-style:none}
.layer-nav li{padding:8px 10px;border-left:3px solid transparent;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.layer-nav li:hover{background:#f3f9ff}
.layer-nav li.active{border-left-color:var(--brand);background:#f3f9ff;font-weight:700}
.layer-nav .prog{font-size:11px;color:var(--text-mute);font-weight:400}
.q{border:1px solid var(--border-light);border-radius:4px;padding:10px 12px;margin-bottom:8px;background:#fff;transition:background .4s}
.q.new{background:#fff8e1;border-color:#fcc003}
.q.focus{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.q .ql{font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.q .req{color:var(--red)}
.q .branch{font-size:11px;color:#8c4b02;background:var(--yellow-bg);border-radius:10px;padding:0 6px;font-weight:400}
.q .why-btn{font-size:11px;font-weight:400;margin-left:auto}
.q input[type=text],.q input[type=number],.q input[type=date],.q select,.q textarea{width:100%;border:1px solid var(--border);border-radius:4px;padding:5px 8px;background:#fff}
.radio-row{display:flex;flex-wrap:wrap;gap:6px}
.radio-row label{border:1px solid var(--border);border-radius:16px;padding:3px 12px;cursor:pointer;user-select:none}
.radio-row input{display:none}
.radio-row input:checked+span{color:#fff}
.radio-row label:has(input:checked){background:var(--brand);border-color:var(--brand);color:#fff}
.why-box{background:#f3f9ff;border-left:3px solid var(--brand);padding:8px 10px;margin-top:6px;font-size:12px;color:var(--text-weak)}
.progress{height:8px;background:#ecebea;border-radius:4px;overflow:hidden}
.progress>div{height:100%;background:var(--green)}

/* ---------- その他 ---------- */
.toast{position:fixed;top:100px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 20px;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:100;min-width:320px;max-width:90vw}
.toast.info{background:#444}
.modal-bg{position:fixed;inset:0;background:rgba(8,7,7,.55);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal{background:#fff;border-radius:4px;width:640px;max-width:100%;max-height:90vh;display:flex;flex-direction:column}
.modal-h{padding:14px 16px;border-bottom:1px solid var(--border);font-size:18px;text-align:center}
.modal-b{padding:16px;overflow:auto}
.modal-f{padding:10px 16px;border-top:1px solid var(--border);background:#f3f3f3;display:flex;justify-content:flex-end;gap:6px}
.flow-step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--border)}
.flow-step .n{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.notif-panel{position:absolute;right:56px;top:46px;width:360px;background:#fff;border:1px solid var(--border);border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:80}
.notif-panel .it{padding:10px 12px;border-bottom:1px solid var(--border-light);font-size:12.5px}
.notif-panel .it.unread{background:#f3f9ff}
.notif-panel .it .tm{font-size:11px;color:var(--text-mute)}
.muted{color:var(--text-mute)}
.small{font-size:11.5px}
.right{text-align:right}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{background:#fffbe6;border:1px solid #f2cf5b;border-radius:4px;padding:8px 10px;font-size:12px;color:#5c4400}
.spec-tag{display:inline-block;font-size:10.5px;border:1px solid #b0adab;color:var(--text-mute);border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:middle;font-weight:400}
.feed-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-light)}
.bar-chart .row{display:grid;grid-template-columns:200px 1fr 90px;align-items:center;gap:8px;margin:6px 0;font-size:12px}
.bar-chart .bars{position:relative;height:22px}
.bar-chart .b1,.bar-chart .b2{position:absolute;left:0;height:10px;border-radius:2px}
.bar-chart .b1{top:0;background:#90d0fe}
.bar-chart .b2{top:11px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-mute);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kb-article h3{font-size:14px;margin:12px 0 4px}
.kb-article p,.kb-article li{font-size:13px}
.kb-article ol{padding-left:20px}
.obj-map{display:grid;grid-template-columns:1fr 1.4fr 2.4fr;gap:12px}
.obj-map .grp{border:2px dashed #8ab8f0;border-radius:6px;padding:8px}
.obj-map .grp h4{color:var(--brand);font-size:13px;margin-bottom:6px}
.cyl{display:inline-block;border-radius:50%/12px;padding:10px 14px;margin:4px;border:1px solid #888;font-size:12px;text-align:center;min-width:90px;cursor:pointer}
.cyl.std{background:#cfe7fd}.cyl.cus{background:#dcebd7}
.cyl:hover{outline:2px solid var(--brand)}
</style>
</head>
<body>
<div class="demo-banner">
  <span><b>画面モック</b>　株式会社日進ProSOL様 Salesforce構築プロジェクト（要件レビュー・業務照合用）</span>
  <span>表示データはすべて架空のデモデータです ／ ブラウザ内のみで動作し、データは保存されません</span>
</div>

<header class="g-header">
  <div class="logo"><div class="mark">P</div><span>日進ProSOL</span></div>
  <div class="g-search"><input id="gsearch" placeholder="案件・商談・取引先・ナレッジを検索..." onkeydown="if(event.key==='Enter')globalSearch(this.value)"></div>
  <div class="g-tools">
    <label class="small muted">ロール</label>
    <select class="role-select" id="roleSel" onchange="setRole(this.value)">
      <option value="kikaku">企画部</option>
      <option value="eigyo">営業部</option>
      <option value="gijutsu">技術部</option>
    </select>
    <button class="icon-btn" title="通知" onclick="toggleNotif()">🔔<span class="badge-count" id="notifCount"></span></button>
    <div class="avatar" id="avatar" title="">山</div>
  </div>
  <div id="notifPanel"></div>
</header>

<nav class="app-nav" id="appNav"></nav>
<main id="main"></main>
<div id="overlay"></div>

<script>
/* =========================================================
   デモデータ（すべて架空）
   ========================================================= */
const TODAY = new Date('2026-10-08');
const STAGES = ['仕様確認','試作加工','機案・見積作成','設計','製造','納入'];
const OPP_STAGES = ['引き合い','ヒアリング','仕様提案','見積提出','交渉','受注'];
const RATE = 8000;          // 社内工数単価（円/h）※デモ用の仮置き
const MARGIN_TARGET = 25;   // 目標粗利率（%）※デモ用の仮置き

const USERS = {
  kikaku:{name:'中村 恵（企画部）',initial:'中'},
  eigyo:{name:'山田 太郎（営業部）',initial:'山'},
  gijutsu:{name:'佐藤 健（技術部）',initial:'佐'}
};

const DB = {
  accounts:[
    {id:'A001',name:'あおば自動車部品株式会社',industry:'自動車',region:'愛知県',type:'既存顧客',phone:'0566-00-0001',owner:'山田 太郎'},
    {id:'A002',name:'みなと精機工業株式会社',industry:'汎用エンジン',region:'静岡県',type:'既存顧客',phone:'054-000-0002',owner:'山田 太郎'},
    {id:'A003',name:'Global Motor Parts (Thailand) Co., Ltd.',industry:'自動車（EV）',region:'タイ',type:'新規',phone:'+66-0-000-0003',owner:'小林 直樹'},
    {id:'A004',name:'さくら油圧株式会社',industry:'油空圧',region:'大阪府',type:'既存顧客',phone:'06-0000-0004',owner:'小林 直樹'},
    {id:'A005',name:'ひかり家電製造株式会社',industry:'家電',region:'滋賀県',type:'既存顧客',phone:'077-000-0005',owner:'山田 太郎'},
    {id:'A006',name:'くすのき二輪工業株式会社',industry:'オートバイ',region:'静岡県',type:'既存顧客',phone:'053-000-0006',owner:'小林 直樹'}

/* ---------- 集約ロジック（進捗・粗利・納期） ---------- */
function pjCalc(p){
  const ks = DB.kousu.filter(k=>k.pj===p.id);
  const plan = ks.reduce((a,k)=>a+k.plan,0), act = ks.reduce((a,k)=>a+k.act,0);
  const laborForecast = Math.max(plan,act)*RATE;
  const costForecast = p.purchase + laborForecast + extraCost(p);
  const addRev = DB.requests.filter(r=>r.pj===p.id&&r.type==='追加請求'&&r.status==='承認済').reduce((a,r)=>a+r.lines.reduce((b,l)=>b+(l.ans||0)*l.q,0),0);
  const revenue = p.amount + addRev;
  const margin = (revenue-costForecast)/revenue*100;
  const days = daysTo(p.due);
  // 進捗：計画上の経過率 vs ステージ進捗率
  const total = (new Date(p.due)-new Date(p.start)), elapsed = (TODAY-new Date(p.start));
  const planPct = Math.min(100,Math.max(0,elapsed/total*100));
  const actPct = p.stage>=5?100:(p.stage/5)*100;
  const progLamp = actPct>=planPct-10?'g':actPct>=planPct-25?'y':'r';
  const marginLamp = margin>=MARGIN_TARGET?'g':margin>=MARGIN_TARGET-5?'y':'r';
  const dueLamp = p.stage>=5?'g':(days<0?'r':(days<30&&p.stage<4)?'r':days<45?'y':'g');
  const overHours = ks.filter(k=>k.act>k.plan).length;
  return {plan,act,costForecast,revenue,addRev,margin,days,planPct,actPct,progLamp,marginLamp,dueLamp,overHours};
}
function extraCost(p){ return 0; }
function lamps(c){ return `<span class="lamps" title="進捗／粗利／納期"><span class="lamp ${c.progLamp}"></span><span class="lamp ${c.marginLamp}"></span><span class="lamp ${c.dueLamp}"></span></span>`; }

function gantt(p){
  const s=new Date(p.start), e=new Date(p.due); s.setDate(1); const span=e-s+86400000*10;
  const pos=d=>((new Date(d)-s)/span*100);
  const months=[]; const m=new Date(s); while(m<=e){months.push(new Date(m));m.setMonth(m.getMonth()+1);}
  const colors={kakou:'#e86e4a',kian:'#4a74e8',sekkei:'#d1446b',seizou:'#7a5af5',chou:'#06a59a'};
  return `<div class="gantt"><div class="g-head"><div></div><div class="g-months">${months.map(d=>`<span style="left:${pos(d)}%">${d.getMonth()+1}月</span>`).join('')}</div></div>
  ${SUBS.map(x=>{const d=p[x.k];const ks=['d1','d2','d3','d4'].filter(k=>d[k]);const a=d[ks[0]],b=d[ks[ks.length-1]];

/* =========================================================
   ヒアリングシート（5レイヤー＋動的分岐）
   ========================================================= */
const LAYERS = [
  {n:1,t:'ビジネス要件',d:'予算・納期・納入先・投資目的'},
  {n:2,t:'対象ワーク要件',d:'加工品名・材質・取代・基準面'},
  {n:3,t:'コア機能（加工）要件',d:'加工条件・定寸方式・軸計測'},
  {n:4,t:'付帯・IF要件',d:'搬入搬出・NG排出・通信'},
  {n:5,t:'非機能要件（仕様・環境）',d:'電圧・安全カバー・塗装・規格'}
];
/* show: 回答に応じて表示する条件（分岐ロジック） */
const QS = [
  {k:'budget',L:1,q:'ご予算（円）',type:'number',req:1,why:'機案の構成（単体機かセル化か）を決める前提。予算と要求が乖離している場合は早期に代替案を提示する。'},
  {k:'due',L:1,q:'希望納期',type:'date',req:1,why:'長納期品（ロボット・主軸ユニット等）の手配判断に使用。聞き漏れると調達・製造の日程が組めない。'},
  {k:'dest',L:1,q:'納入先',type:'radio',opts:['国内','海外'],req:1,why:'海外の場合、規格対応・該非判定・現地電源の確認が追加で必要になる（後工程で最も手戻りが多い項目）。'},
  {k:'country',L:1,q:'納入国',type:'text',show:a=>a.dest==='海外',br:'納入先＝海外',req:1,why:'国により規格（CE/CCC等）・電源周波数が異なるため。'},
  {k:'std',L:1,q:'CE／CCC等の規格対応が必要ですか？',type:'radio',opts:['CE','CCC','UL','不要','不明（要確認）'],show:a=>a.dest==='海外',br:'納入先＝海外',req:1,why:'規格対応は安全カバー・制御盤の設計と原価に直結する。'},
  {k:'export',L:1,q:'該非判定は必要ですか？',type:'radio',opts:['必要','不要','不明（要確認）'],show:a=>a.dest==='海外',br:'納入先＝海外',req:1,why:'輸出管理上の手続きが必要か判断する。出荷直前に発覚すると納期遅延の原因となる。'},
  {k:'purpose',L:1,q:'投資目的',type:'radio',opts:['増産','省人化','品質向上','老朽更新'],req:0,why:'提案の軸（タクト重視か、精度重視か）を決める。'},
  {k:'equip',L:1,q:'設備種別',type:'radio',opts:['単体ホーニング盤','自動機','セル機'],req:1,why:'自動機・セル機の場合、搬入搬出・ロボットの要件（Layer4）が必須になる。'},
  {k:'work',L:2,q:'加工品名',type:'text',req:1,why:'過去類似案件の検索キーになる。'},
  {k:'material',L:2,q:'材質',type:'select',opts:['','鋳鉄（FC250）','鋼（SCM415）','アルミ（ADC12）','焼入れ鋼','その他'],req:1,why:'砥石選定・加工条件・試作加工の要否を決める。'},
  {k:'stock',L:2,q:'取代（μm）',type:'number',req:1,why:'加工工程数（粗・仕上げの段数）とサイクルタイムの算出に使用。'},
  {k:'dia',L:2,q:'加工穴径／長さ',type:'text',req:1,why:'ヘッド・ツーリングの選定に使用。'},
  {k:'base',L:2,q:'加工前基準面',type:'text',req:0,why:'治具設計の前提。前工程の精度不足は芯ずれ不具合の原因になる（ナレッジKB01参照）。'},
  {k:'process',L:3,q:'加工条件',type:'radio',opts:['仕上げのみ（1段）','粗＋仕上げ（2段）','3段以上'],req:1,why:'軸数・機械構成を決める。'},
  {k:'gauge',L:3,q:'定寸方式',type:'radio',opts:['インプロセス エアゲージ','機械式定寸','ポストプロセス計測','不要'],req:1,why:'要求精度と測定方式の組み合わせを確認する。'},
  {k:'spindle',L:3,q:'軸数',type:'number',req:1,why:'機種選定（単軸・多軸）に使用。'},
  {k:'rank',L:3,q:'ランクセレクトは必要ですか？',type:'radio',opts:['必要','不要'],req:1,why:'ランク分け装置の追加有無。後からの追加は追加請求となりやすい。'},

  {k:'robotMaker',L:4,q:'ロボットのメーカー指定はありますか？',type:'radio',opts:['指定あり','指定なし'],show:a=>a.load==='ロボット',br:'搬入搬出＝ロボット',req:1,why:'顧客標準メーカーがある場合、調達先・制御方式が変わる。'},
  {k:'robotName',L:4,q:'指定メーカー・機種',type:'text',show:a=>a.load==='ロボット'&&a.robotMaker==='指定あり',br:'メーカー指定あり',req:1,why:'通信IF・安全仕様の確認に使用。'},
  {k:'ifc',L:4,q:'上位設備との通信IF',type:'select',opts:['','なし（I/O接点のみ）','EtherNet/IP','CC-Link','PROFINET','その他'],show:a=>a.load==='ロボット'||a.equip!=='単体ホーニング盤',br:'自動機／ロボット',req:1,why:'ライン統合時の通信方式。設計後半での変更は制御盤の作り直しになる。'},
  {k:'ng',L:4,q:'NG品の排出方法',type:'radio',opts:['NGシュート排出','停止・手動取出し','不要'],req:0,why:'自動運転時の異常処置を決める。'},
  {k:'coolant',L:4,q:'クーラント供給方式',type:'radio',opts:['単独タンク','集中供給'],req:0,why:'集中供給の場合はタンク容量・配管が変わる（ナレッジKB03より追加された項目）。'},
  {k:'volt',L:5,q:'電源電圧',type:'select',opts:['','200V','220V','380V','400V','その他'],req:1,why:'トランス要否・制御盤設計の前提。'},
  {k:'freq',L:5,q:'現地電源周波数は？',type:'radio',opts:['50Hz','60Hz'],show:a=>a.dest==='海外',br:'納入先＝海外',req:1,why:'国内と異なる場合が多いため海外案件では必須（ナレッジKB02）。'},
  {k:'cover',L:5,q:'安全カバー',type:'radio',opts:['全面カバー','部分カバー','顧客にて手配'],req:1,why:'規格対応・設置スペースと合わせて確認。'},
  {k:'paint',L:5,q:'塗装色',type:'radio',opts:['当社標準色','顧客指定色'],req:0,why:'顧客指定色の場合は色番号を確認。'},
  {k:'paintNo',L:5,q:'塗装色番号（マンセル等）',type:'text',show:a=>a.paint==='顧客指定色',br:'顧客指定色',req:1,why:'外注塗装の手配に必要。'}
];
const visibleQs = a => QS.filter(q=>!q.show||q.show(a));
function layerProg(a,L){const qs=visibleQs(a).filter(q=>q.L===L&&q.req);const done=qs.filter(q=>a[q.k]);return [done.length,qs.length];}

  return `<div class="page-h"><div class="top"><span class="obj-icon i-hear">📋</span><div><div class="obj-label">ヒアリングシート</div><h1>すべてのヒアリングシート ▾</h1></div>
    <div class="actions"><button class="btn brand" onclick="newHearing()">新規</button></div></div></div>
  <div class="card"><div class="card-b tbl-wrap" style="padding-top:12px"><table class="tbl"><thead><tr><th>ヒアリングシート名</th><th>取引先</th><th>商談</th><th>状況</th><th>必須項目の回答率</th><th>最終更新</th></tr></thead><tbody>
  ${DB.hearings.map(h=>{const a=h.ans;let d=0,t=0;LAYERS.forEach(L=>{const[x,y]=layerProg(a,L.n);d+=x;t+=y});
    return `<tr><td><a href="#/hearing/${h.id}">${esc(h.name)}</a></td><td>${esc(acc(h.acc).name)}</td><td><a href="#/opp/${h.opp}">${esc((byId(DB.opps,h.opp)||{}).name)}</a></td><td>${stPill(h.status==='完了'?'承認済':'依頼中').replace(/承認済|依頼中/,h.status)}</td>
    <td style="min-width:160px"><div class="progress"><div style="width:${d/t*100}%"></div></div><span class="small muted">${d}/${t}</span></td><td>${fmtD(h.updated)}</td></tr>`}).join('')}
  </tbody></table></div></div>`;
}
function newHearing(oppId){
  const o = oppId?byId(DB.opps,oppId):DB.opps.find(o=>!DB.hearings.find(h=>h.opp===o.id)&&o.stage<5);
  const id='H'+String(100+DB.hearings.length);
  DB.hearings.unshift({id,name:`HS-00${30+DB.hearings.length} ${acc(o.acc).name.replace('株式会社','')} ${o.name}`,opp:o.id,acc:o.acc,status:'回答中',updated:'2026-10-08',ans:{}});
  UI.hsLayer=1; location.hash='#/hearing/'+id; toast('ヒアリングシートを作成し、商談に紐付けました');
}
function pgHearing(id){
  const h=byId(DB.hearings,id); if(!h) return notFound();
  const a=h.ans, L=UI.hsLayer, qs=visibleQs(a).filter(q=>q.L===L);
  let D=0,T=0; LAYERS.forEach(x=>{const[d,t]=layerProg(a,x.n);D+=d;T+=t});
  const hidden=QS.filter(q=>q.L===L&&q.show&&!q.show(a)).length;
  return `<div class="page-h"><div class="top"><span class="obj-icon i-hear">📋</span><div><div class="obj-label">ヒアリングシート</div><h1>${esc(h.name)}</h1></div>
    <div class="actions"><button class="btn" onclick="toast('一時保存しました','info')">一時保存</button><button class="btn brand" onclick="hsComplete('${id}')">回答完了・商談へ連携</button></div></div>
    <div class="highlights">${fld('取引先',esc(acc(h.acc).name))}${fld('商談',`<a href="#/opp/${h.opp}">${esc((byId(DB.opps,h.opp)||{}).name)}</a>`)}${fld('状況',h.status)}${fld('必須項目の回答',`${D} / ${T}`)}</div></div>
  <div class="hs-layout">
    <div class="card"><div class="card-h">レイヤー</div><ul class="layer-nav">${LAYERS.map(x=>{const[d,t]=layerProg(a,x.n);
      return `<li class="${x.n===L?'active':''}" onclick="UI.hsLayer=${x.n};route()"><div>Layer${x.n}<br><span>${x.t}</span><div class="prog">${x.d}</div></div><span class="pill ${d===t?'g':d?'y':''}">${d}/${t}</span></li>`}).join('')}</ul>
      <div class="card-b mt8"><div class="small muted">全体の回答率</div><div class="progress mt8"><div style="width:${T?D/T*100:0}%"></div></div></div></div>
    <div><div class="card"><div class="card-h">Layer${L}：${LAYERS[L-1].t}<span class="right small muted">${hidden?`回答内容により ${hidden} 問を非表示中`:''}</span></div>
      <div class="card-b" id="qArea">${qs.map(q=>qHtml(q,a,id)).join('')}
      <div class="flex mt12">${L>1?`<button class="btn" onclick="UI.hsLayer=${L-1};route()">← 前のレイヤー</button>`:''}<span style="margin-left:auto"></span>${L<5?`<button class="btn brand" onclick="UI.hsLayer=${L+1};route()">次のレイヤー →</button>`:`<button class="btn brand" onclick="hsComplete('${id}')">回答完了</button>`}</div></div></div></div>
    <div>
      <div class="card"><div class="card-h">💡 ヒアリング意図（Whyガイド）</div><div class="card-b" id="whyPanel">${whyPanel(UI.hsFocus)}</div></div>
      <div class="card"><div class="card-h">分岐ロジックの状態</div><div class="card-b small">${branchState(a)}</div></div>
      <div class="card"><div class="card-h">関連ナレッジ</div><div class="card-b small">${a.dest==='海外'?`<div><a href="#/kb/KB02">📖 海外向け案件：電源電圧・周波数の確認手順</a></div>`:''}<div><a href="#/kb/KB01">📖 主軸芯ずれの原因と対策（ベース平面度）</a></div><div><a href="#/kb/KB03">📖 クーラントタンク容量変更時の確認ポイント</a></div></div></div>
    </div>
  </div>`;
}
function qHtml(q,a,hid){
  const v=a[q.k]||''; const n=`onchange="hsSet('${hid}','${q.k}',this.value)"`;
  let input;
  if(q.type==='radio') input=`<div class="radio-row">${q.opts.map(o=>`<label><input type="radio" name="${q.k}" value="${o}" ${v===o?'checked':''} ${n}><span>${o}</span></label>`).join('')}</div>`;
  else if(q.type==='select') input=`<select ${n}>${q.opts.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
  else input=`<input type="${q.type}" value="${esc(v)}" ${n} onfocus="hsFocus('${q.k}')">`;
  return `<div class="q ${UI.hsNew&&UI.hsNew.includes(q.k)?'new':''} ${UI.hsFocus===q.k?'focus':''}" onclick="hsFocus('${q.k}')"><div class="ql">${q.req?'<span class="req">*</span>':''}${q.q}${q.br?`<span class="branch">分岐：${q.br}</span>`:''}
    <a class="why-btn" onclick="event.stopPropagation();hsFocus('${q.k}')">なぜ聞く？</a></div>${input}</div>`;
}
function whyPanel(k){
  const q=QS.find(x=>x.k===k);
  if(!q) return '<div class="muted small">質問をクリックすると、「なぜ聞くのか」「聞かないと後工程で何が起こるか」を表示します。経験の浅い営業でも次に何を聞くかを迷わないためのガイドです。</div>';
  return `<div><b>${q.q}</b></div><div class="why-box">${q.why}</div><div class="small muted mt8">Layer${q.L}：${LAYERS[q.L-1].t}${q.req?'｜必須':''}</div>`;
}
function hsFocus(k){UI.hsFocus=k;const w=$('#whyPanel');if(w)w.innerHTML=whyPanel(k);document.querySelectorAll('.q').forEach(e=>e.classList.remove('focus'));}
function hsSet(hid,k,v){
  const h=byId(DB.hearings,hid); const before=visibleQs(h.ans).map(q=>q.k);
  h.ans[k]=v; h.updated='2026-10-08'; UI.hsFocus=k;
  const after=visibleQs(h.ans).map(q=>q.k);
  const added=after.filter(x=>!before.includes(x)), removed=before.filter(x=>!after.includes(x));
  UI.hsNew=added;
  removed.forEach(x=>delete h.ans[x]);
  if(added.length){const qs=added.map(x=>QS.find(q=>q.k===x));toast(`分岐：回答に応じて ${added.length} 問を追加しました（${qs.map(q=>'Layer'+q.L).filter((v,i,s)=>s.indexOf(v)===i).join('・')}）`,'info');}
  else if(removed.length) toast(`分岐：不要になった ${removed.length} 問を非表示にしました`,'info');
  const y=window.scrollY; route(); window.scrollTo(0,y); setTimeout(()=>{UI.hsNew=null},50);
}
function branchState(a){
  const rules=[
    ['納入先＝海外',a.dest==='海外','納入国・規格対応・該非判定・現地電源周波数を追加'],
    ['設備種別＝自動機／セル機',a.equip&&a.equip!=='単体ホーニング盤','通信IFを追加'],
    ['ランクセレクト＝必要',a.rank==='必要','ランク数を追加'],
    ['搬入搬出＝ロボット',a.load==='ロボット','メーカー指定・通信IFを追加'],
    ['塗装＝顧客指定色',a.paint==='顧客指定色','色番号を追加']];
  return rules.map(r=>`<div class="flex" style="padding:3px 0"><span class="pill ${r[1]?'g':''}">${r[1]?'ON':'OFF'}</span><div><b>${r[0]}</b><div class="muted">${r[2]}</div></div></div>`).join('');
}
function hsComplete(id){
  const h=byId(DB.hearings,id); let D=0,T=0; const miss=[];
  LAYERS.forEach(x=>{const[d,t]=layerProg(h.ans,x.n);D+=d;T+=t;if(d<t)miss.push('Layer'+x.n)});
  if(D<T){toast(`必須項目が未回答です（${miss.join('、')}）。抜け漏れ防止のため完了できません`,'info');return;}
  h.status='完了'; const o=byId(DB.opps,h.opp);
  if(o&&h.ans.budget&&o.stage<2) o.stage=2;
  toast('ヒアリングシートを完了し、商談へ連携しました（予算・納期・設備種別を商談に反映）'); route();
}

function pgRequests(){
  const rs=ROLE==='gijutsu'?DB.requests:DB.requests;

    <div class="grp"><h4>営業支援</h4>${c('商談','std','#/opps')}${c('見積','std','#/opp/O001')}${c('商談商品','std','#/opp/O001')}${c('商品','std','#/products')}${c('ヒアリングシート','cus','#/hearings')}</div>
    <div class="grp"><h4>案件管理</h4>${c('案件管理','cus','#/projects')}<br>${SUBS.map(s=>c(s.label.replace('機案見積','機案'),'cus','#/sub/P003/'+s.k)).join('')}<br>${c('工数管理','cus','#/project/P003')}${c('依頼','cus','#/requests')}${c('ケース（変更・問題）','std','#/cases')}${c('ナレッジ（再発防止）','std','#/knowledge')}</div>
  </div>
  <div class="note mt12">「オブジェクト構成図案」をもとに、御見積書 ver2.2 のスコープ（ヒアリングシート電子化 No.9／変更・問題情報管理 No.12／原価予実管理 No.10）を追加して画面化しています。配置・実装方式は要件レビューで確定します。</div></div></div>`;
}

/* ---------- 検索 ---------- */
function globalSearch(q){ if(q.trim()) location.hash='#/search/'+encodeURIComponent(q.trim()); }
function pgSearch(q){
  const m=s=>String(s).toLowerCase().includes(q.toLowerCase());
  const res=[...DB.projects.filter(p=>m(p.name)||m(p.no)).map(p=>['案件',p.name,'#/project/'+p.id,'i-project','📁']),
    ...DB.opps.filter(o=>m(o.name)).map(o=>['商談',o.name,'#/opp/'+o.id,'i-opp','★']),
    ...DB.accounts.filter(a=>m(a.name)).map(a=>['取引先',a.name,'#/account/'+a.id,'i-acc','🏢']),
    ...DB.knowledge.filter(k=>m(k.title)||m(JSON.stringify(k.body))).map(k=>['ナレッジ',k.title,'#/kb/'+k.id,'i-know','📖']),
    ...DB.cases.filter(c=>m(c.subject)).map(c=>['ケース',c.subject,'#/case/'+c.id,'i-case','⚠'])];
  return `<div class="page-h"><h1>「${esc(q)}」の検索結果（${res.length}件）</h1></div><div class="card"><div class="card-b" style="padding-top:8px">
    ${res.map(r=>`<div class="feed-item"><span class="obj-icon sm ${r[3]}">${r[4]}</span><div><a href="${r[2]}">${esc(r[1])}</a><div class="small muted">${r[0]}</div></div></div>`).join('')||'<div class="muted">該当なし</div>'}</div></div>`;
}

/* ---------- 共通部品 ---------- */
function notFound(){return `<div class="card"><div class="card-b" style="padding:24px">レコードが見つかりません。<a href="#/home">ホームへ</a></div></div>`}
function nowStr(){return '2026/10/08 '+new Date().toTimeString().slice(0,5)}
let toastTimer;
function toast(msg,kind){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;document.body.appendChild(t);
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),3800);
}
let modalOk=null;
function modal(title,body,onOk,okLabel){
  modalOk=onOk;
  $('#overlay').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h">${title}</div><div class="modal-b">${body}</div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">${onOk?'キャンセル':'閉じる'}</button>${onOk?`<button class="btn brand" onclick="modalSubmit()">${okLabel||'保存'}</button>`:''}</div></div></div>`;
}
function modalSubmit(){const f=modalOk;closeModal();if(f){f();route();}}
function closeModal(){$('#overlay').innerHTML='';}
function renderNotifCount(){const n=DB.notifs.filter(x=>x.unread).length;const b=$('#notifCount');b.textContent=n||'';b.style.display=n?'':'none';
  if(UI.notifOpen) renderNotifPanel();}
function toggleNotif(){UI.notifOpen=!UI.notifOpen;renderNotifPanel();}
function renderNotifPanel(){
  $('#notifPanel').innerHTML=UI.notifOpen?`<div class="notif-panel"><div class="card-h">通知<span class="right"><a onclick="DB.notifs.forEach(n=>n.unread=false);renderNotifCount()">すべて既読にする</a></span></div>
    ${DB.notifs.slice(0,8).map((n,i)=>`<div class="it ${n.unread?'unread':''}"><a href="${n.link}" onclick="DB.notifs[${i}].unread=false;UI.notifOpen=false;renderNotifPanel()">${esc(n.t)}</a><div class="tm">${n.tm}</div></div>`).join('')}</div>`:'';
}
document.addEventListener('click',e=>{if(UI.notifOpen&&!e.target.closest('.notif-panel')&&!e.target.closest('.icon-btn')){UI.notifOpen=false;renderNotifPanel();}});


$('#avatar').title=USERS[ROLE].name; $('#avatar').textContent=USERS[ROLE].initial;
route();
</script>
